<html lang="id">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Aplikasi Absensi</title>

<body>

<div id="loginContainer">

  <main class="login-page">

    <section class="login-card">

      <div class="brand">

        <div
          class="brand-logo"
          id="brandLogo"
        >
          <span>✓</span>
        </div>

        <h1 id="appName">
          Aplikasi Absensi
        </h1>

        <p>
          Silakan masuk untuk melanjutkan
        </p>

      </div>


      <form
        id="loginForm"
        autocomplete="on"
      >

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              👤
            </span>

            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="Masukkan username"
              maxlength="30"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              🔒
            </span>

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
              maxlength="128"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Tampilkan password"
            >
              👁
            </button>

          </div>

        </div>


        <div
          id="loginMessage"
          class="message hidden"
          role="alert"
        ></div>


        <button
          type="submit"
          id="loginButton"
          class="btn btn-primary btn-login"
        >

          <span id="loginButtonText">
            Masuk
          </span>

          <span
            id="loginSpinner"
            class="spinner hidden"
          ></span>

        </button>

      </form>


      <div class="login-footer">

        <span>
          Sistem Absensi Karyawan
        </span>

      </div>

    </section>

  </main>

</div>
