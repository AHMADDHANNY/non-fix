.admin-modal {

  display: flex;

}

.admin-modal.hidden {
  display: none;
}

.admin-modal-card {
  width: min(700px, 100%);
  max-height: 90vh;

  justify-content: space-between;

}

  margin: 0;
}

.admin-close {
  border: 0;
  background: transparent;
  font-size: 25px;
  cursor: pointer;
  color: #68758a;
}

.admin-image {
  max-width: 100%;
  max-height: 260px;
  border-radius: 10px;

  .admin-form,
  .admin-detail-grid {

</style>

<script>
(function () {

  'use strict';

  /* ============================================================
     GLOBAL STATE
     ============================================================ */

  var TOKEN_KEY = 'absensi_session_token';
  var USER_KEY = 'absensi_session_user';

  var initialized = false;
  var currentPage = 'dashboard';
  var dashboardLoading = false;
  var clockTimer = null;
  var toastTimer = null;

  var rekapPage = 1;
  var izinPage = 1;
  var usersPage = 1;

  var rekapUsers = [];
  var izinUsers = [];

  /* ============================================================
     INIT
     ============================================================ */

  function init() {

    if (initialized) {
      return;
    }

    initialized = true;

    var token = getToken();

    if (!token) {
      redirectLogin();
      return;
    }

    setupNavigation();
    setupQuickActions();
    setupMobileMenu();
    setupLogout();
    setupRefresh();
    startClock();
    loadStoredUser();

    verifyAdminSession(token);
  }

  /* ============================================================
     STORAGE
     ============================================================ */

  function getToken() {

    try {
      return localStorage.getItem(TOKEN_KEY) || '';
    } catch (e) {
      return '';
    }
  }

  function getStoredUser() {

    try {

      var raw =
        localStorage.getItem(USER_KEY);

      return raw
        ? JSON.parse(raw)
        : null;

    } catch (e) {
      return null;
    }
  }

  function saveUser(user) {

    try {

      localStorage.setItem(
        USER_KEY,
        JSON.stringify(user || {})
      );

    } catch (e) {}
  }

  function clearSession() {

    try {

      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);

    } catch (e) {}
  }

  /* ============================================================
     SESSION
     ============================================================ */

  function verifyAdminSession(token) {

    showLoading('Memeriksa sesi admin...');

    google.script.run

      .withSuccessHandler(function (response) {

        if (
          !response ||
          response.valid !== true ||
          !response.user
        ) {

          hideLoading();
          clearSession();
          redirectLogin();
          return;
        }

        var role =
          String(
            response.user.role || ''
          )
          .trim()
          .toLowerCase();

        if (role !== 'admin') {

          hideLoading();
          clearSession();
          showToast(
            'Akses hanya untuk administrator.',
            'error'
          );

          setTimeout(
            redirectLogin,
            800
          );

          return;
        }

        saveUser(response.user);
        applyUser(response.user);
        loadDashboard();

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showToast(
          normalizeError(error),
          'error'
        );

        setTimeout(
          redirectLogin,
          1000
        );

      })

      .verifySession(token);
  }

  /* ============================================================
     USER UI
     ============================================================ */

  function loadStoredUser() {

    var user = getStoredUser();

    if (user) {
      applyUser(user);
    }
  }

  function applyUser(user) {

    var name =
      String(
        user.nama ||
        user.username ||
        'Administrator'
      );

    setText(
      'welcomeName',
      name
    );

    setText(
      'topbarUserName',
      name
    );

    setText(
      'topbarUserRole',
      'Administrator'
    );

    var avatar =
      document.getElementById(
        'topbarAvatar'
      );

    if (!avatar) {
      return;
    }

    if (user.foto_profil) {

      avatar.innerHTML =
        '<img src="' +
        escapeAttribute(
          user.foto_profil
        ) +
        '" alt="Foto profil">';

    } else {

      avatar.textContent =
        getInitial(name);
    }
  }

  /* ============================================================
     DASHBOARD
     ============================================================ */

  function loadDashboard() {

    if (dashboardLoading) {
      return;
    }

    var token = getToken();

    if (!token) {
      redirectLogin();
      return;
    }

    dashboardLoading = true;

    showLoading(
      'Memuat dashboard...'
    );

    google.script.run

      .withSuccessHandler(function (response) {

        dashboardLoading = false;
        hideLoading();

        if (
          !response ||
          response.success !== true
        ) {

          showToast(
            response &&
            response.message
              ? response.message
              : 'Dashboard gagal dimuat.',
            'error'
          );

          return;
        }

        applyDashboard(
          response.data || {}
        );

      })

      .withFailureHandler(function (error) {

        dashboardLoading = false;
        hideLoading();

        showToast(
          normalizeError(error),
          'error'
        );

      })

      .getDashboardAdmin(token);
  }

  function applyDashboard(data) {

    setText(
      'statPegawai',
      numberFormat(data.total_pegawai)
    );

    setText(
      'statHadir',
      numberFormat(data.hadir_hari_ini)
    );

    setText(
      'statTerlambat',
      numberFormat(data.terlambat_hari_ini)
    );

    setText(
      'statBelumAbsen',
      numberFormat(data.belum_absen_hari_ini)
    );

    setText(
      'statIzinPending',
      numberFormat(data.izin_pending)
    );

    setText(
      'statAdmin',
      numberFormat(data.total_admin)
    );

    setText(
      'summaryHadir',
      numberFormat(data.hadir_hari_ini)
    );

    setText(
      'summaryTerlambat',
      numberFormat(data.terlambat_hari_ini)
    );

    setText(
      'summaryBelumAbsen',
      numberFormat(data.belum_absen_hari_ini)
    );

    setText(
      'summaryIzin',
      numberFormat(data.izin_pending)
    );

    if (data.tanggal) {

      var date =
        parseDate(data.tanggal);

      if (date) {

        setText(
          'todayDate',
          formatDateLong(date)
        );
      }
    }

    loadAppSettings();
  }

  /* ============================================================
     NAVIGATION
     ============================================================ */

  function setupNavigation() {

    document
      .querySelectorAll(
        '#adminApp .nav-item[data-page]'
      )
      .forEach(function (item) {

        item.addEventListener(
          'click',
          function () {

            navigate(
              item.getAttribute(
                'data-page'
              )
            );

          }
        );

      });
  }

  function setupQuickActions() {

    document
      .querySelectorAll(
        '#adminApp .quick-card[data-go]'
      )
      .forEach(function (item) {

        item.addEventListener(
          'click',
          function () {

            navigate(
              item.getAttribute(
                'data-go'
              )
            );

          }
        );

      });
  }

  function navigate(page) {

    if (!page) {
      return;
    }

    currentPage = page;

    document
      .querySelectorAll(
        '#adminApp .app-page'
      )
      .forEach(function (section) {

        section.classList.toggle(
          'active',
          section.id ===
          'page-' + page
        );

      });

    document
      .querySelectorAll(
        '#adminApp .nav-item[data-page]'
      )
      .forEach(function (item) {

        item.classList.toggle(
          'active',
          item.getAttribute(
            'data-page'
          ) === page
        );

      });

    var titles = {

      dashboard: [
        'Dashboard',
        'Ringkasan aktivitas hari ini'
      ],

      rekap: [
        'Rekap Absensi',
        'Rekap kehadiran seluruh pegawai'
      ],

      izin: [
        'Pengajuan Izin',
        'Kelola pengajuan pegawai'
      ],

      users: [
        'Manajemen User',
        'Kelola akun pengguna'
      ],

      pengaturan: [
        'Pengaturan',
        'Konfigurasi aplikasi'
      ]

    };

    var title =
      titles[page] ||
      titles.dashboard;

    setText(
      'pageTitle',
      title[0]
    );

    setText(
      'pageSubtitle',
      title[1]
    );

    closeMobileMenu();

    if (page === 'rekap') {
      loadRekap();
    }

    if (page === 'izin') {
      loadIzin();
    }

    if (page === 'users') {
      loadUsers();
    }

    if (page === 'pengaturan') {
      loadSettingsPage();
    }
  }

  /* ============================================================
     MOBILE
     ============================================================ */

  function setupMobileMenu() {

    var button =
      document.getElementById(
        'menuButton'
      );

    var overlay =
      document.getElementById(
        'sidebarOverlay'
      );

    if (button) {

      button.addEventListener(
        'click',
        function () {

          var sidebar =
            document.getElementById(
              'sidebar'
            );

          if (!sidebar) {
            return;
          }

          sidebar.classList.toggle(
            'open'
          );

          if (overlay) {

            overlay.classList.toggle(
              'show'
            );
          }

        }
      );
    }

    if (overlay) {

      overlay.addEventListener(
        'click',
        closeMobileMenu
      );
    }
  }

  function closeMobileMenu() {

    var sidebar =
      document.getElementById(
        'sidebar'
      );

    var overlay =
      document.getElementById(
        'sidebarOverlay'
      );

    if (sidebar) {

      sidebar.classList.remove(
        'open'
      );
    }

    if (overlay) {

      overlay.classList.remove(
        'show'
      );
    }
  }

  /* ============================================================
     CLOCK
     ============================================================ */

  function startClock() {

    updateClock();

    if (clockTimer) {

      clearInterval(
        clockTimer
      );
    }

    clockTimer =
      setInterval(
        updateClock,
        1000
      );
  }

  function updateClock() {

    var now = new Date();

    setText(
      'todayClock',
      pad(now.getHours()) +
      ':' +
      pad(now.getMinutes()) +
      ':' +
      pad(now.getSeconds())
    );

    setText(
      'todayDate',
      formatDateLong(now)
    );
  }

  /* ============================================================
     REFRESH
     ============================================================ */

  function setupRefresh() {

    var button =
      document.getElementById(
        'refreshDashboard'
      );

    if (!button) {
      return;
    }

    button.addEventListener(
      'click',
      function () {

        loadDashboard();

      }
    );
  }

  /* ============================================================
     LOGOUT
     ============================================================ */

  function setupLogout() {

    var button =
      document.getElementById(
        'sidebarLogout'
      );

    var cancel =
      document.getElementById(
        'cancelLogout'
      );

    var confirm =
      document.getElementById(
        'confirmLogout'
      );

    if (button) {

      button.addEventListener(
        'click',
        function () {

          var modal =
            document.getElementById(
              'logoutModal'
            );

          if (modal) {

            modal.classList.remove(
              'hidden'
            );
          }

        }
      );
    }

    if (cancel) {

      cancel.addEventListener(
        'click',
        function () {

          var modal =
            document.getElementById(
              'logoutModal'
            );

          if (modal) {

            modal.classList.add(
              'hidden'
            );
          }

        }
      );
    }

    if (confirm) {

      confirm.addEventListener(
        'click',
        performLogout
      );
    }
  }

  function performLogout() {

    var token =
      getToken();

    clearSession();

    var modal =
      document.getElementById(
        'logoutModal'
      );

    if (modal) {

      modal.classList.add(
        'hidden'
      );
    }

    showLoading(
      'Keluar...'
    );

    if (!token) {

      redirectLogin();
      return;
    }

    google.script.run

      .withSuccessHandler(function () {

        redirectLogin();

      })

      .withFailureHandler(function () {

        /*
         * Session lokal sudah dihapus.
         * Tetap kembali ke Login walaupun
         * penghapusan server gagal.
         */

        redirectLogin();

      })

      .logout(token);
  }

  /* ============================================================
     REKAP ABSENSI
     ============================================================ */

  function loadRekap() {

    var container =
      document.getElementById(
        'rekapContent'
      );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<div class="admin-module">' +

      '<div class="admin-toolbar">' +

      '<div class="admin-filter">' +
      '<input id="rekapTanggal" type="date">' +
      '</div>' +

      '<div class="admin-filter">' +
      '<input id="rekapBulan" type="month">' +
      '</div>' +

      '<div class="admin-filter">' +
      '<select id="rekapUser">' +
      '<option value="">Semua Pegawai</option>' +
      '</select>' +
      '</div>' +

      '<div class="admin-filter">' +
      '<select id="rekapStatus">' +
      '<option value="">Semua Status</option>' +
      '<option value="Hadir">Hadir</option>' +
      '<option value="Terlambat">Terlambat</option>' +
      '</select>' +
      '</div>' +

      '<button class="admin-btn admin-btn-primary" id="btnCariRekap">' +
      '🔎 Cari' +
      '</button>' +

      '<button class="admin-btn admin-btn-secondary" id="btnResetRekap">' +
      'Reset' +
      '</button>' +

      '<button class="admin-btn admin-btn-success" id="btnExportRekap">' +
      '📄 Export PDF' +
      '</button>' +

      '</div>' +

      '<div id="rekapTable"></div>' +

      '</div>';

    loadEmployeeDropdown(
      'rekapUser'
    );

    document
      .getElementById(
        'btnCariRekap'
      )
      .onclick = function () {

        rekapPage = 1;
        fetchRekap();

      };

    document
      .getElementById(
        'btnResetRekap'
      )
      .onclick = function () {

        document.getElementById(
          'rekapTanggal'
        ).value = '';

        document.getElementById(
          'rekapBulan'
        ).value = '';

        document.getElementById(
          'rekapUser'
        ).value = '';

        document.getElementById(
          'rekapStatus'
        ).value = '';

        rekapPage = 1;
        fetchRekap();

      };

    document
      .getElementById(
        'btnExportRekap'
      )
      .onclick = exportRekap;

    fetchRekap();
  }

  function fetchRekap() {

    var table =
      document.getElementById(
        'rekapTable'
      );

    if (!table) {
      return;
    }

    table.innerHTML =
      '<div class="admin-loading">Memuat rekap absensi...</div>';

    var tanggal =
      getValue('rekapTanggal');

    var bulan =
      getValue('rekapBulan');

    var user =
      getValue('rekapUser');

    var status =
      getValue('rekapStatus');

    google.script.run

      .withSuccessHandler(function (response) {

        if (
          !response ||
          response.success !== true
        ) {

          table.innerHTML =
            errorBox(
              response &&
              response.message
                ? response.message
                : 'Gagal memuat rekap.'
            );

          return;
        }

        renderRekap(
          response.data || [],
          response.pagination || {}
        );

      })

      .withFailureHandler(function (error) {

        table.innerHTML =
          errorBox(
            normalizeError(error)
          );

      })

      .getRekapAbsensiAdmin(
        getToken(),
        rekapPage,
        20,
        tanggal,
        bulan,
        user,
        status
      );
  }

  function renderRekap(data, pagination) {

    var table =
      document.getElementById(
        'rekapTable'
      );

    if (!table) {
      return;
    }

    if (!data.length) {

      table.innerHTML =
        '<div class="admin-empty">' +
        'Tidak ada data absensi untuk filter yang dipilih.' +
        '</div>';

      return;
    }

    var html =
      '<div class="admin-table-wrap">' +
      '<table class="admin-table">' +
      '<thead><tr>' +
      '<th>Tanggal</th>' +
      '<th>Pegawai</th>' +
      '<th>Jabatan</th>' +
      '<th>Masuk</th>' +
      '<th>Pulang</th>' +
      '<th>Status</th>' +
      '<th>Aksi</th>' +
      '</tr></thead><tbody>';

    data.forEach(function (row) {

      html +=
        '<tr>' +

        '<td>' +
        esc(row.tanggal) +
        '</td>' +

        '<td>' +
        '<strong>' +
        esc(row.nama) +
        '</strong><br>' +
        '<small>' +
        esc(row.username) +
        '</small>' +
        '</td>' +

        '<td>' +
        esc(row.jabatan || '-') +
        '</td>' +

        '<td>' +
        esc(row.jam_masuk || '-') +
        '</td>' +

        '<td>' +
        esc(row.jam_pulang || '-') +
        '</td>' +

          );

      String(password);

      prompt(

      konfirmasi !== password
    ) {

      showToast(
        'Konfirmasi password tidak cocok.',

      );

      return;
    }

    showLoading(
      'Mereset password...'
    );

    google.script.run

      .withSuccessHandler(function (response) {

        hideLoading();

        showToast(
          response &&
          response.message
            ? response.message
            : (
              response &&
              response.success
                ? 'Password berhasil direset.'
                : 'Reset password gagal.'
            ),
          response &&
          response.success
            ? 'success'
            : 'error'
        );

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showToast(
          normalizeError(error),
          'error'
        );

      })

      .resetPasswordUser(
        getToken(),
        idUser,
        password
      );
  }

  function hapusUser(idUser) {

    if (
      !confirm(
        'Nonaktifkan user ini? Data absensi dan riwayat izin tetap dipertahankan.'
      )
    ) {
      return;
    }

    showLoading(
      'Menonaktifkan user...'
    );

    google.script.run

      .withSuccessHandler(function (response) {

        hideLoading();

        if (
          !response ||
          response.success !== true
        ) {

          showToast(
            response &&
            response.message
              ? response.message
              : 'Gagal menonaktifkan user.',
            'error'
          );

          return;
        }

        showToast(
          response.message ||
          'User berhasil dinonaktifkan.',
          'success'
        );

        fetchUsers();
        loadDashboard();

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showToast(
          normalizeError(error),
          'error'
        );

      })

      .hapusUser(
        getToken(),
        idUser
      );
  }

  /* ============================================================
     SETTINGS
     ============================================================ */

  function loadSettingsPage() {

    var container =
      document.getElementById(
        'pengaturanContent'
      );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<div class="admin-module">' +
      '<div class="admin-loading">Memuat pengaturan...</div>' +
      '</div>';

    google.script.run

      .withSuccessHandler(function (response) {

        if (
          !response ||
          response.success !== true
        ) {

          container.innerHTML =
            errorBox(
              response &&
              response.message
                ? response.message
                : 'Gagal mengambil pengaturan.'
            );

          return;
        }

        renderSettings(
          response.data || {}
        );

      })

      .withFailureHandler(function (error) {

        container.innerHTML =
          errorBox(
            normalizeError(error)
          );

      })

      .getPengaturanAdmin(
        getToken()
      );
  }

  function renderSettings(data) {

    var container =
      document.getElementById(
        'pengaturanContent'
      );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<form id="adminSettingsForm" class="admin-form">' +

      '<div class="admin-field full">' +
      '<label>Nama Aplikasi</label>' +
      '<input id="settingNamaApp" required value="' +
      escapeAttribute(
        data.nama_app || ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field full">' +
      '<label>URL Logo</label>' +
      '<input id="settingLogoUrl" value="' +
      escapeAttribute(
        data.logo_url || ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field">' +
      '<label>Latitude Kantor</label>' +
      '<input id="settingLat" type="number" step="any" required value="' +
      escapeAttribute(
        data.lat_kantor != null
          ? data.lat_kantor
          : ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field">' +
      '<label>Longitude Kantor</label>' +
      '<input id="settingLong" type="number" step="any" required value="' +
      escapeAttribute(
        data.long_kantor != null
          ? data.long_kantor
          : ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field">' +
      '<label>Radius Absensi (meter)</label>' +
      '<input id="settingRadius" type="number" min="1" max="10000" required value="' +
      escapeAttribute(
        data.radius_meter != null
          ? data.radius_meter
          : ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field">' +
      '<label>Toleransi Terlambat (menit)</label>' +
      '<input id="settingToleransi" type="number" min="0" max="300" required value="' +
      escapeAttribute(
        data.toleransi_menit != null
          ? data.toleransi_menit
          : ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field">' +
      '<label>Jam Masuk</label>' +
      '<input id="settingJamMasuk" type="time" required value="' +
      escapeAttribute(
        data.jam_masuk || ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-field">' +
      '<label>Jam Pulang</label>' +
      '<input id="settingJamPulang" type="time" required value="' +
      escapeAttribute(
        data.jam_pulang || ''
      ) +
      '">' +
      '</div>' +

      '<div class="admin-form-actions">' +
      '<button type="submit" class="admin-btn admin-btn-primary">' +
      '💾 Simpan Pengaturan' +
      '</button>' +
      '</div>' +

      '</form>' +

      '<div class="admin-panel" style="margin-top:18px">' +
      '<h3>Informasi</h3>' +
      '<p>' +
      'Pengaturan ini digunakan oleh sistem absensi untuk nama aplikasi, lokasi kantor, radius, jam kerja, dan toleransi keterlambatan.' +
      '</p>' +
      '</div>';

    document
      .getElementById(
        'adminSettingsForm'
      )
      .addEventListener(
        'submit',
        function (event) {

          event.preventDefault();

          saveSettings();

        }
      );
  }

  function saveSettings() {

    showLoading(
      'Menyimpan pengaturan...'
    );

    google.script.run

      .withSuccessHandler(function (response) {

        hideLoading();

        if (
          !response ||
          response.success !== true
        ) {

          showToast(
            response &&
            response.message
              ? response.message
              : 'Gagal menyimpan pengaturan.',
            'error'
          );

          return;
        }

        showToast(
          response.message ||
          'Pengaturan berhasil disimpan.',
          'success'
        );

        setText(
          'sidebarAppName',
          getValue('settingNamaApp')
        );

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showToast(
          normalizeError(error),
          'error'
        );

      })

      .simpanPengaturan(
        getToken(),
        getValue('settingNamaApp'),
        getValue('settingLogoUrl'),
        getValue('settingLat'),
        getValue('settingLong'),
        getValue('settingRadius'),
        getValue('settingJamMasuk'),
        getValue('settingJamPulang'),
        getValue('settingToleransi')
      );
  }

  /* ============================================================
     EMPLOYEE DROPDOWN
     ============================================================ */

  function loadEmployeeDropdown(selectId) {

    var select =
      document.getElementById(
        selectId
      );

    if (!select) {
      return;
    }

    google.script.run

      .withSuccessHandler(function (response) {

        if (
          !response ||
          response.success !== true
        ) {
          return;
        }

        var list =
          response.data || [];

        list.forEach(function (user) {

          var option =
            document.createElement(
              'option'
            );

          option.value =
            user.id_user;

          option.textContent =
            user.nama +
            (
              user.jabatan
                ? ' - ' + user.jabatan
                : ''
            );

          select.appendChild(
            option
          );

        });

      })

      .withFailureHandler(function () {})

      .getDaftarPegawaiAktif(
        getToken()
      );
  }

  /* ============================================================
     PAGINATION
     ============================================================ */

  function paginationHtml(
    pagination,
    type
  ) {

    var page =
      Number(
        pagination.page || 1
      );

    var totalPage =
      Number(
        pagination.totalPage || 0
      );

    var total =
      Number(
        pagination.total || 0
      );

    if (totalPage <= 1) {

      return (
        '<div class="admin-pagination">' +
        '<div class="admin-pagination-info">' +
        total +
        ' data' +
        '</div>' +
        '</div>'
      );
    }

    var prevDisabled =
      page <= 1
        ? ' disabled'
        : '';

    var nextDisabled =
      page >= totalPage
        ? ' disabled'
        : '';

    return (

      '<div class="admin-pagination">' +

      '<div class="admin-pagination-info">' +
      'Halaman ' +
      page +
      ' dari ' +
      totalPage +
      ' • ' +
      total +
      ' data' +
      '</div>' +

      '<div class="admin-pagination-buttons">' +

      '<button class="admin-btn admin-btn-secondary" ' +
      prevDisabled +
      ' onclick="window.AdminApp.page(\'' +
      type +
      '\',' +
      (page - 1) +
      ')">' +
      '‹ Sebelumnya' +
      '</button>' +

      '<button class="admin-btn admin-btn-secondary" ' +
      nextDisabled +
      ' onclick="window.AdminApp.page(\'' +
      type +
      '\',' +
      (page + 1) +
      ')">' +
      'Berikutnya ›' +
      '</button>' +

      '</div>' +

      '</div>'
    );
  }

  function changePage(
    type,
    page
  ) {

    if (page < 1) {
      return;
    }

    if (type === 'rekap') {

      rekapPage = page;
      fetchRekap();

    }

    if (type === 'izin') {

      izinPage = page;
      fetchIzin();

    }

    if (type === 'users') {

      usersPage = page;
      fetchUsers();

    }
  }

  /* ============================================================
     MODAL
     ============================================================ */

  function openModal(
    title,
    body
  ) {

    closeModal();

    var modal =
      document.createElement(
        'div'
      );

    modal.id =
      'adminDynamicModal';

    modal.className =
      'admin-modal';

    modal.innerHTML =
      '<div class="admin-modal-card">' +

      '<div class="admin-modal-header">' +

      '<h3>' +
      esc(title) +
      '</h3>' +

      '<button class="admin-close" onclick="window.AdminApp.closeModal()">' +
      '×' +
      '</button>' +

      '</div>' +

      '<div id="adminModalBody">' +
      body +
      '</div>' +

      '</div>';

    document.body.appendChild(
      modal
    );

    modal.addEventListener(
      'click',
      function (event) {

        if (
          event.target === modal
        ) {

          closeModal();

        }

      }
    );
  }

  function setModalBody(
    html
  ) {

    var body =
      document.getElementById(
        'adminModalBody'
      );

    if (body) {
      body.innerHTML = html;
    }
  }

  function closeModal() {

    var modal =
      document.getElementById(
        'adminDynamicModal'
      );

    if (modal) {
      modal.remove();
    }
  }

  /* ============================================================
     SETTINGS / APP NAME
     ============================================================ */

  function loadAppSettings() {

    var token =
      getToken();

    if (!token) {
      return;
    }

    google.script.run

      .withSuccessHandler(function (response) {

        if (
          response &&
          response.success &&
          response.data
        ) {

          setText(
            'sidebarAppName',
            response.data.nama_app ||
            'Absensi'
          );

        }

      })

      .withFailureHandler(function () {})

      .getPengaturanAdmin(
        token
      );
  }

  /* ============================================================
     REDIRECT
     ============================================================ */

  function redirectLogin() {

    var base =
      window.location.href
        .split('?')[0];

    window.top.location.href =
      base +
      '?page=Login';
  }

  /* ============================================================
     LOADING
     ============================================================ */

  function showLoading(text) {

    var el =
      document.getElementById(
        'globalLoading'
      );

    var textEl =
      document.getElementById(
        'loadingText'
      );

    if (textEl) {

      textEl.textContent =
        text ||
        'Memuat...';
    }

    if (el) {

      el.classList.remove(
        'hidden'
      );
    }
  }

  function hideLoading() {

    var el =
      document.getElementById(
        'globalLoading'
      );

    if (el) {

      el.classList.add(
        'hidden'
      );
    }
  }

  /* ============================================================
     TOAST
     ============================================================ */

  function showToast(
    message,
    type
  ) {

    var toast =
      document.getElementById(
        'toast'
      );

    if (!toast) {
      return;
    }

    clearTimeout(
      toastTimer
    );

    toast.textContent =
      message || '';

    toast.className =
      'toast show ' +
      (
        type || ''
      );

    toastTimer =
      setTimeout(
        function () {

          toast.classList.remove(
            'show'
          );

        },
        3500
      );
  }

  /* ============================================================
     HELPERS
     ============================================================ */

  function setText(
    id,
    value
  ) {

    var el =
      document.getElementById(
        id
      );

    if (el) {

      el.textContent =
        value == null
          ? ''
          : String(value);
    }
  }

  function getValue(
    id
  ) {

    var el =
      document.getElementById(
        id
      );

    return el
      ? el.value
      : '';
  }

  function numberFormat(
    value
  ) {

    var n =
      Number(value);

    if (isNaN(n)) {
      n = 0;
    }

    return n.toLocaleString(
      'id-ID'
    );
  }

  function parseDate(
    value
  ) {

    var parts =
      String(value)
        .split('-');

    if (
      parts.length !== 3
    ) {
      return null;
    }

    var d =
      new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );

    return isNaN(
      d.getTime()
    )
      ? null
      : d;
  }

  function formatDateLong(
    date
  ) {

    var days = [
      'Minggu',
      'Senin',
      'Selasa',
      'Rabu',
      'Kamis',
      'Jumat',
      'Sabtu'
    ];

    var months = [
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember'
    ];

    return (
      days[date.getDay()] +
      ', ' +
      date.getDate() +
      ' ' +
      months[date.getMonth()] +
      ' ' +
      date.getFullYear()
    );
  }

  function pad(n) {

    return String(n)
      .padStart(
        2,
        '0'
      );
  }

  function getInitial(
    name
  ) {

    var value =
      String(
        name || 'A'
      ).trim();

    return value
      ? value
          .charAt(0)
          .toUpperCase()
      : 'A';
  }

  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );
    }

    if (
      typeof error ===
      'string'
    ) {

      return error;
    }

    return (
      error.message ||
      'Terjadi kesalahan pada server.'
    );
  }

  function escapeAttribute(
    value
  ) {

    return String(
      value || ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      );
  }

  function esc(
    value
  ) {

    return String(
      value == null
        ? ''
        : value
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );
  }

  function jsArg(
    value
  ) {

    return String(
      value == null
        ? ''
        : value
    )
      .replace(
        /\\/g,
        '\\\\'
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /\r/g,
        ''
      )
      .replace(
        /\n/g,
        '\\n'
      );
  }

  function statusBadge(
    value,
    forcedColor
  ) {

    var text =
      String(
        value || '-'
      );

    var color =
      forcedColor;

    if (!color) {

      if (
        text === 'Disetujui' ||
        text === 'aktif' ||
        text === 'Hadir'
      ) {

        color = 'green';

      } else if (
        text === 'Menunggu' ||
        text === 'Terlambat'
      ) {

        color = 'orange';

      } else if (
        text === 'Ditolak' ||
        text === 'nonaktif'
      ) {

        color = 'red';

      } else {

        color = 'blue';
      }
    }

    return (
      '<span class="admin-badge admin-badge-' +
      color +
      '">' +
      esc(text) +
      '</span>'
    );
  }

  function detailItem(
    label,
    value
  ) {

    return (
      '<div class="admin-detail-item">' +
      '<small>' +
      esc(label) +
      '</small>' +
      '<strong>' +
      esc(
        value == null ||
        value === ''
          ? '-'
          : value
      ) +
      '</strong>' +
      '</div>'
    );
  }

  function errorBox(
    message
  ) {

    return (
      '<div class="admin-error">' +
      esc(message) +
      '</div>'
    );
  }

  function downloadBase64File(
    base64,
    mimeType,
    fileName
  ) {

    var binary =
      atob(base64);

    var length =
      binary.length;

    var bytes =
      new Uint8Array(
        length
      );

    for (
      var i = 0;
      i < length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(i);
    }

    var blob =
      new Blob(
        [bytes],
        {
          type:
            mimeType ||
            'application/octet-stream'
        }
      );

    var url =
      URL.createObjectURL(
        blob
      );

    var a =
      document.createElement(
        'a'
      );

    a.href = url;
    a.download =
      fileName || 'download';

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      function () {
        URL.revokeObjectURL(url);
      },
      1000
    );
  }

  /* ============================================================
     PUBLIC API
     ============================================================ */

  window.AdminApp = {

    init: init,

    navigate: navigate,

    refresh: loadDashboard,

    page: changePage,

    detailAbsensi:
      detailAbsensi,

    prosesIzin:
      prosesIzin,

    editUser:
      editUser,

    resetPassword:
      resetPassword,

    hapusUser:
      hapusUser,

    closeModal:
      closeModal

  };

})();
</script>
