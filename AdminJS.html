<script>

(function () {

  'use strict';

  var TOKEN_KEY =
    'absensi_session_token';

  var USER_KEY =
    'absensi_session_user';

  var currentPage =
    'dashboard';

  var initialized =
    false;

  var loading =
    false;

  var toastTimer =
    null;


  /* =========================================================
     INIT
     ========================================================= */

  function init() {

    if (initialized) {
      loadDashboard();
      return;
    }

    initialized = true;

    var token =
      getToken();

    if (!token) {
      redirectLogin();
      return;
    }

    setupNavigation();
    setupQuickActions();
    setupLogout();
    setupRefresh();
    setupMobileMenu();

    loadStoredUser();

    startClock();

    verifyAdminSession(
      token
    );

  }


  /* =========================================================
     SESSION
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          TOKEN_KEY
        ) || ''
      );

    } catch (e) {

      return '';

    }

  }


  function getUser() {

    try {

      var raw =
        localStorage.getItem(
          USER_KEY
        );

      return raw
        ? JSON.parse(raw)
        : null;

    } catch (e) {

      return null;

    }

  }


  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        USER_KEY,
        JSON.stringify(
          user || {}
        )
      );

    } catch (e) {}

  }


  function clearSession() {

    try {

      localStorage.removeItem(
        TOKEN_KEY
      );

      localStorage.removeItem(
        USER_KEY
      );

    } catch (e) {}

  }


  function verifyAdminSession(
    token
  ) {

    showLoading(
      'Memeriksa sesi admin...'
    );

    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            response.valid !== true ||
            !response.user
          ) {

            clearSession();

            redirectLogin();

            return;

          }

          var role =
            String(
              response.user.role || ''
            )
            .trim()
            .toLowerCase();

          if (
            role !== 'admin'
          ) {

            clearSession();

            redirectLogin();

            return;

          }

          saveUser(
            response.user
          );

          applyUser(
            response.user
          );

          loadDashboard();

        }
      )

      .withFailureHandler(
        function (error) {

          hideLoading();

          showToast(
            normalizeError(error),
            'error'
          );

          setTimeout(
            redirectLogin,
            1500
          );

        }
      )

      .verifySession(
        token
      );

  }


  /* =========================================================
     USER
     ========================================================= */

  function loadStoredUser() {

    var user =
      getUser();

    if (user) {
      applyUser(user);
    }

  }


  function applyUser(
    user
  ) {

    var name =
      String(
        user.nama ||
        user.username ||
        'Administrator'
      );

    setText(
      'welcomeName',
      name
    );

    setText(
      'topbarUserName',
      name
    );

    setText(
      'topbarUserRole',
      'Administrator'
    );

    var avatar =
      document.getElementById(
        'topbarAvatar'
      );

    if (!avatar) {
      return;
    }

    if (
      user.foto_profil
    ) {

      avatar.innerHTML =
        '<img src="' +
        escapeAttribute(
          user.foto_profil
        ) +
        '" alt="Foto profil">';

    } else {

      avatar.textContent =
        getInitial(name);

    }

  }


  /* =========================================================
     DASHBOARD
     ========================================================= */

  function loadDashboard() {

    if (loading) {
      return;
    }

    var token =
      getToken();

    if (!token) {
      redirectLogin();
      return;
    }

    loading = true;

    showLoading(
      'Memuat dashboard...'
    );

    google.script.run

      .withSuccessHandler(
        function (response) {

          loading = false;

          hideLoading();

          if (
            !response ||
            response.success !== true
          ) {

            showToast(
              response &&
              response.message
                ? response.message
                : 'Dashboard gagal dimuat.',
              'error'
            );

            return;

          }

          applyDashboard(
            response.data || {}
          );

        }
      )

      .withFailureHandler(
        function (error) {

          loading = false;

          hideLoading();

          showToast(
            normalizeError(error),
            'error'
          );

        }
      )

      .getDashboardAdmin(
        token
      );

  }


  function applyDashboard(
    data
  ) {

    setText(
      'statPegawai',
      numberFormat(
        data.total_pegawai
      )
    );

    setText(
      'statHadir',
      numberFormat(
        data.hadir_hari_ini
      )
    );

    setText(
      'statTerlambat',
      numberFormat(
        data.terlambat_hari_ini
      )
    );

    setText(
      'statBelumAbsen',
      numberFormat(
        data.belum_absen_hari_ini
      )
    );

    setText(
      'statIzinPending',
      numberFormat(
        data.izin_pending
      )
    );

    setText(
      'statAdmin',
      numberFormat(
        data.total_admin
      )
    );

    setText(
      'summaryHadir',
      numberFormat(
        data.hadir_hari_ini
      )
    );

    setText(
      'summaryTerlambat',
      numberFormat(
        data.terlambat_hari_ini
      )
    );

    setText(
      'summaryBelumAbsen',
      numberFormat(
        data.belum_absen_hari_ini
      )
    );

    setText(
      'summaryIzin',
      numberFormat(
        data.izin_pending
      )
    );

    if (
      data.tanggal
    ) {

      var date =
        parseDate(
          data.tanggal
        );

      if (date) {

        setText(
          'todayDate',
          formatDateLong(
            date
          )
        );

      }

    }

    loadAppSettings();

  }


  /* =========================================================
     NAVIGATION
     ========================================================= */

  function setupNavigation() {

    document
      .querySelectorAll(
        '#adminApp .nav-item[data-page]'
      )
      .forEach(
        function (item) {

          item.addEventListener(
            'click',
            function () {

              navigate(
                item.getAttribute(
                  'data-page'
                )
              );

            }
          );

        }
      );

  }


  function setupQuickActions() {

    document
      .querySelectorAll(
        '#adminApp .quick-card[data-go]'
      )
      .forEach(
        function (item) {

          item.addEventListener(
            'click',
            function () {

              navigate(
                item.getAttribute(
                  'data-go'
                )
              );

            }
          );

        }
      );

  }


  function navigate(
    page
  ) {

    if (!page) {
      return;
    }

    currentPage =
      page;

    document
      .querySelectorAll(
        '#adminApp .app-page'
      )
      .forEach(
        function (section) {

          section.classList.toggle(
            'active',
            section.id ===
            'page-' + page
          );

        }
      );

    document
      .querySelectorAll(
        '#adminApp .nav-item[data-page]'
      )
      .forEach(
        function (item) {

          item.classList.toggle(
            'active',
            item.getAttribute(
              'data-page'
            ) === page
          );

        }
      );

    var titles = {

      dashboard: [
        'Dashboard',
        'Ringkasan aktivitas hari ini'
      ],

      rekap: [
        'Rekap Absensi',
        'Rekap kehadiran seluruh pegawai'
      ],

      izin: [
        'Pengajuan Izin',
        'Kelola pengajuan pegawai'
      ],

      users: [
        'Manajemen User',
        'Kelola akun pengguna'
      ],

      pengaturan: [
        'Pengaturan',
        'Konfigurasi aplikasi'
      ]

    };

    var title =
      titles[page] ||
      titles.dashboard;

    setText(
      'pageTitle',
      title[0]
    );

    setText(
      'pageSubtitle',
      title[1]
    );

    closeMobileMenu();

    if (
      page === 'rekap'
    ) {
      loadRekap();
    }

    if (
      page === 'izin'
    ) {
      loadIzin();
    }

    if (
      page === 'users'
    ) {
      loadUsers();
    }

    if (
      page === 'pengaturan'
    ) {
      loadSettings();
    }

  }


  /* =========================================================
     REKAP
     ========================================================= */

  function loadRekap() {

    var container =
      document.getElementById(
        'rekapContent'
      );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<div class="admin-module">' +

      '<div class="module-toolbar">' +

      '<input id="rekapTanggal" type="date">' +

      '<input id="rekapBulan" type="month">' +

      '<select id="rekapUser">' +
      '<option value="">Semua Pegawai</option>' +
      '</select>' +

      '<select id="rekapStatus">' +
      '<option value="">Semua Status</option>' +
      '<option value="Hadir">Hadir</option>' +
      '<option value="Terlambat">Terlambat</option>' +
      '<option value="Alpa">Alpa</option>' +
      '</select>' +

      '<button type="button" id="btnLoadRekap">Cari</button>' +

      '<button type="button" id="btnExportRekap">Export PDF</button>' +

      '</div>' +

      '<div id="rekapResult">' +
      'Memuat data...' +
      '</div>' +

      '</div>';

    loadPegawaiDropdown(
      'rekapUser'
    );

    document
      .getElementById(
        'btnLoadRekap'
      )
      .onclick =
      function () {
        fetchRekap(1);
      };

    document
      .getElementById(
        'btnExportRekap'
      )
      .onclick =
      exportRekap;

    fetchRekap(1);

  }


  function fetchRekap(
    page
  ) {

    var token =
      getToken();

    var tanggal =
      valueOf(
        'rekapTanggal'
      );

    var bulan =
      valueOf(
        'rekapBulan'
      );

    var user =
      valueOf(
        'rekapUser'
      );

    var status =
      valueOf(
        'rekapStatus'
      );

    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            !response.success
          ) {

            setHtml(
              'rekapResult',
              errorBox(
                response &&
                response.message
                  ? response.message
                  : 'Gagal memuat rekap.'
              )
            );

            return;

          }

          renderRekap(
            response
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setHtml(
            'rekapResult',
            errorBox(
              normalizeError(error)
            )
          );

        }
      )

      .getRekapAbsensiAdmin(
        token,
        page,
        20,
        tanggal,
        bulan,
        user,
        status
      );

  }


  function renderRekap(
    response
  ) {

    var rows =
      response.data || [];

    if (!rows.length) {

      setHtml(
        'rekapResult',
        '<div class="empty-state">Tidak ada data absensi.</div>'
      );

      return;

    }

    var html =
      '<div style="overflow:auto">' +
      '<table class="admin-table">' +
      '<thead><tr>' +
      '<th>Tanggal</th>' +
      '<th>Nama</th>' +
      '<th>Jabatan</th>' +
      '<th>Masuk</th>' +
      '<th>Pulang</th>' +
      '<th>Status</th>' +
      '<th>Jarak Masuk</th>' +
      '</tr></thead><tbody>';

    rows.forEach(
      function (row) {

        html +=
          '<tr>' +
          '<td>' +
          safe(row.tanggal) +
          '</td>' +
          '<td>' +
          safe(row.nama) +
          '</td>' +
          '<td>' +
          safe(row.jabatan) +
          '</td>' +
          '<td>' +
          safe(row.jam_masuk || '-') +
          '</td>' +
          '<td>' +
          safe(row.jam_pulang || '-') +
          '</td>' +
          '<td>' +
          safe(row.status || '-') +
          '</td>' +
          '<td>' +
          safe(row.jarak_masuk_meter || '-') +
          '</td>' +
          '</tr>';

      }
    );

    html +=
      '</tbody></table></div>';

    var pagination =
      response.pagination || {};

    html +=
      '<div class="module-pagination">' +

      '<button type="button" ' +
      'onclick="AdminApp.rekapPage(' +
      ((pagination.page || 1) - 1) +
      ')" ' +
      (
        (pagination.page || 1) <= 1
          ? 'disabled'
          : ''
      ) +
      '>‹</button>' +

      '<span>Halaman ' +
      (pagination.page || 1) +
      ' / ' +
      (pagination.totalPage || 1) +
      '</span>' +

      '<button type="button" ' +
      'onclick="AdminApp.rekapPage(' +
      ((pagination.page || 1) + 1) +
      ')" ' +
      (
        (pagination.page || 1) >=
        (pagination.totalPage || 1)
          ? 'disabled'
          : ''
      ) +
      '>›</button>' +

      '</div>';

    setHtml(
      'rekapResult',
      html
    );

  }


  function exportRekap() {

    var token =
      getToken();

    showLoading(
      'Membuat PDF...'
    );

    google.script.run

      .withSuccessHandler(
        function (response) {

          hideLoading();

          if (
            !response ||
            !response.success
          ) {

            showToast(
              response &&
              response.message
                ? response.message
                : 'Export gagal.',
              'error'
            );

            return;

          }

          showToast(
            'PDF berhasil dibuat.',
            'success'
          );

          downloadPdf(
            response.data.fileId
          );

        }
      )

      .withFailureHandler(
        function (error) {

          hideLoading();

          showToast(
            normalizeError(error),
            'error'
          );

        }
      )

      .exportRekapAbsensiPDF(
        token,
        valueOf('rekapTanggal'),
        valueOf('rekapBulan'),
        valueOf('rekapUser')
      );

  }


  function downloadPdf(
    fileId
  ) {

    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            !response.success ||
            !response.data
          ) {

            showToast(
              'PDF tidak dapat diunduh.',
              'error'
            );

            return;

          }

          var bytes =
            base64ToArrayBuffer(
              response.data.base64
            );

          var blob =
            new Blob(
              [bytes],
              {
                type:
                  response.data.mimeType ||
                  'application/pdf'
              }
            );

          var url =
            URL.createObjectURL(
              blob
            );

          var a =
            document.createElement(
              'a'
            );

          a.href = url;

          a.download =
            response.data.fileName ||
            'Rekap_Absensi.pdf';

          document.body.appendChild(a);

          a.click();

          a.remove();

          setTimeout(
            function () {
              URL.revokeObjectURL(
                url
              );
            },
            1000
          );

        }
      )

      .withFailureHandler(
        function (error) {

          showToast(
            normalizeError(error),
            'error'
          );

        }
      )

      .downloadRekapAbsensiPDF(
        getToken(),
        fileId
      );

  }


  /* =========================================================
     IZIN
     ========================================================= */

  function loadIzin() {

    var container =
      document.getElementById(
        'izinContent'
      );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<div class="admin-module">' +

      '<div class="module-toolbar">' +

      '<select id="izinStatus">' +
      '<option value="">Semua Status</option>' +
      '<option value="Menunggu">Menunggu</option>' +
      '<option value="Disetujui">Disetujui</option>' +
      '<option value="Ditolak">Ditolak</option>' +
      '</select>' +

      '<input id="izinBulan" type="month">' +

      '<select id="izinUser">' +
      '<option value="">Semua Pegawai</option>' +
      '</select>' +

      '<button type="button" id="btnLoadIzin">Cari</button>' +

      '</div>' +

      '<div id="izinResult">' +
      'Memuat data...' +
      '</div>' +

      '</div>';

    loadPegawaiDropdown(
      'izinUser'
    );

    document
      .getElementById(
        'btnLoadIzin'
      )
      .onclick =
      function () {
        fetchIzin(1);
      };

    fetchIzin(1);

  }


  function fetchIzin(
    page
  ) {

    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            !response.success
          ) {

            setHtml(
              'izinResult',
              errorBox(
                response &&
                response.message
                  ? response.message
                  : 'Gagal memuat izin.'
              )
            );

            return;

          }

          renderIzin(
            response
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setHtml(
            'izinResult',
            errorBox(
              normalizeError(error)
            )
          );

        }
      )

      .getDaftarIzinAdmin(
        getToken(),
        page,
        20,
        valueOf('izinStatus'),
        valueOf('izinBulan'),
        valueOf('izinUser')
      );

  }


  function renderIzin(
    response
  ) {

    var rows =
      response.data || [];

    if (!rows.length) {

      setHtml(
        'izinResult',
        '<div class="empty-state">Tidak ada pengajuan izin.</div>'
      );

      return;

    }

    var html =
      '<div style="overflow:auto">' +
      '<table class="admin-table">' +
      '<thead><tr>' +
      '<th>Tanggal</th>' +
      '<th>Pegawai</th>' +
      '<th>Jenis</th>' +
      '<th>Periode</th>' +
      '<th>Keterangan</th>' +
      '<th>Status</th>' +
      '<th>Aksi</th>' +
      '</tr></thead><tbody>';

    rows.forEach(
      function (row) {

        var action = '';

        if (
          row.status ===
          'Menunggu'
        ) {

          action =
            '<button class="btn-mini success" ' +
            'onclick="AdminApp.prosesIzin(\'' +
            escapeJs(row.id_izin) +
            '\',\'Disetujui\')">' +
            'Setujui' +
            '</button> ' +

            '<button class="btn-mini danger" ' +
            'onclick="AdminApp.prosesIzin(\'' +
            escapeJs(row.id_izin) +
            '\',\'Ditolak\')">' +
            'Tolak' +
            '</button>';

        }

        html +=
          '<tr>' +
          '<td>' +
          safe(row.tanggal_pengajuan) +
          '</td>' +
          '<td>' +
          safe(row.nama_pegawai) +
          '</td>' +
          '<td>' +
          safe(row.jenis_izin) +
          '</td>' +
          '<td>' +
          safe(row.tanggal_mulai) +
          ' s/d ' +
          safe(row.tanggal_selesai) +
          '</td>' +
          '<td>' +
          safe(row.keterangan) +
          '</td>' +
          '<td>' +
          safe(row.status) +
          '</td>' +
          '<td>' +
          action +
          '</td>' +
          '</tr>';

      }
    );

    html +=
      '</tbody></table></div>';

    setHtml(
      'izinResult',
      html
    );

  }


  function prosesIzin(
    idIzin,
    status
  ) {

    var catatan =
      '';

    if (
      status ===
      'Ditolak'
    ) {

      catatan =
        window.prompt(
          'Catatan penolakan:',
          ''
        ) || '';

    }

    if (
      !window.confirm(
        status ===
        'Disetujui'
          ? 'Setujui pengajuan ini?'
          : 'Tolak pengajuan ini?'
      )
    ) {
      return;
    }

    showLoading(
      'Memproses pengajuan...'
    );

    google.script.run

      .withSuccessHandler(
        function (response) {

          hideLoading();

          if (
            !response ||
            !response.success
          ) {

            showToast(
              response &&
              response.message
                ? response.message
                : 'Gagal memproses izin.',
              'error'
            );

            return;

          }

          showToast(
            response.message ||
            'Pengajuan berhasil diproses.',
            'success'
          );

          fetchIzin(1);

          loadDashboard();

        }
      )

      .withFailureHandler(
        function (error) {

          hideLoading();

          showToast(
            normalizeError(error),
            'error'
          );

        }
      )

      .prosesIzin(
        getToken(),
        idIzin,
        status,
        catatan
      );

  }


  /* =========================================================
     USERS
     ========================================================= */

  function loadUsers() {

    var container =
      document.getElementById(
        'usersContent'
      );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<div class="admin-module">' +

      '<div class="module-toolbar">' +

      '<input id="userSearch" ' +
      'placeholder="Cari nama, username, jabatan...">' +

      '<select id="userRole">' +
      '<option value="">Semua Role</option>' +
      '<option value="admin">Admin</option>' +
      '<option value="pegawai">Pegawai</option>' +
      '</select>' +

      '<select id="userStatus">' +
      '<option value="">Semua Status</option>' +
      '<option value="aktif">Aktif</option>' +
      '<option value="nonaktif">Nonaktif</option>' +
      '</select>' +

      '<button type="button" id="btnLoadUsers">Cari</button>' +

      '<button type="button" id="btnAddUser">+ Tambah User</button>' +

      '</div>' +

      '<div id="userFormBox"></div>' +

      '<div id="usersResult">' +
      'Memuat data...' +
      '</div>' +

      '</div>';

    document
      .getElementById(
        'btnLoadUsers'
      )
      .onclick =
      function () {
        fetchUsers(1);
      };

    document
      .getElementById(
        'btnAddUser'
      )
      .onclick =
      showAddUserForm;

    fetchUsers(1);

  }


  function fetchUsers(
    page
  ) {

    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            !response.success
          ) {

            setHtml(
              'usersResult',
              errorBox(
                response &&
                response.message
                  ? response.message
                  : 'Gagal memuat user.'
              )
            );

            return;

          }

          renderUsers(
            response
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setHtml(
            'usersResult',
            errorBox(
              normalizeError(error)
            )
          );

        }
      )

      .getDaftarUsers(
        getToken(),
        page,
        20,
        valueOf('userSearch'),
        valueOf('userRole'),
        valueOf('userStatus')
      );

  }


  function renderUsers(
    response
  ) {

    var rows =
      response.data || [];

    if (!rows.length) {

      setHtml(
        'usersResult',
        '<div class="empty-state">Tidak ada user.</div>'
      );

      return;

    }

    var html =

            modal.classList.add(

  function performLogout() {

  var token =
    getToken();


  clearSession();


  var modal =
    document.getElementById(
      'logoutModal'
    );


  if (modal) {

    modal.classList.add(
      'hidden'
    );

  }


  /*
   * Simpan URL Login sebelum request server.
   */
  var base =
    String(
      window.ABSENSI_WEB_APP_URL ||
      ''
    ).trim();


  /*
   * Logout server tetap dipanggil.
   */
  if (token) {

    google.script.run

      .withSuccessHandler(
        function () {}
      )

      .withFailureHandler(
        function () {}
      )

      .logout(
        token
      );

  }


  /*
   * Navigasi dilakukan sekarang,
   * masih berada dalam aksi klik user.
   */
  if (base) {

    navigateTopLogin(
      base
    );

  } else {

    google.script.run

      .withSuccessHandler(
        function (url) {

          if (url) {

            navigateTopLogin(
              url
            );

          }

        }
      )

      .getWebAppUrl();

  }

}

function redirectLogin() {

  clearSession();


  var base =
    String(
      window.ABSENSI_WEB_APP_URL ||
      ''
    ).trim();


  if (!base) {

    google.script.run

      .withSuccessHandler(
        function (url) {

          if (!url) {

            showToast(
              'URL Web App tidak tersedia.',
              'error'
            );

            return;

          }


          navigateTopLogin(
            url
          );

        }
      )

      .withFailureHandler(
        function (error) {

          showToast(
            normalizeError(
              error
            ),
            'error'
          );

        }
      )

      .getWebAppUrl();

    return;

  }


  navigateTopLogin(
    base
  );

}


function navigateTopLogin(
  base
) {

  var separator =
    base.indexOf('?') >= 0
      ? '&'
      : '?';


  var url =
    base +
    separator +
    'page=Login';


  /*
   * Anchor target="_top".
   *
   * Dipanggil dari aksi user saat logout,
   * sehingga navigasi top-level diizinkan
   * oleh sandbox Apps Script.
   */
  var link =
    document.createElement(
      'a'
    );


  link.href =
    url;

  link.target =
    '_top';

  link.rel =
    'noopener';

  link.style.display =
    'none';


  document.body.appendChild(
    link
  );


  link.click();

}

  /* =========================================================

  function valueOf(

  function numberFormat(
    value
  ) {

    var number =
      Number(value);

    if (
      isNaN(number)
    ) {
      number = 0;
    }

    return number.toLocaleString(
      'id-ID'
    );

  }


  function parseDate(
    value
  ) {

    var parts =
      String(value)
        .split('-');

    if (
      parts.length !== 3
    ) {
      return null;
    }

    var date =
      new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );

    return isNaN(
      date.getTime()
    )
      ? null
      : date;

  }


  function formatDateLong(
    date
  ) {

    var days = [
      'Minggu',
      'Senin',
      'Selasa',
      'Rabu',
      'Kamis',
      'Jumat',
      'Sabtu'
    ];

    var months = [
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember'
    ];

    return (
      days[date.getDay()] +
      ', ' +
      date.getDate() +
      ' ' +
      months[date.getMonth()] +
      ' ' +
      date.getFullYear()
    );

  }


  function pad(
    number
  ) {

    return String(
      number
    ).padStart(
      2,
      '0'
    );

  }


  function getInitial(
    name
  ) {

    var value =
      String(
        name || 'A'
      ).trim();

    return value
      ? value.charAt(0).toUpperCase()
      : 'A';

  }


  function safe(
    value
  ) {

    return String(
      value == null
        ? ''
        : value
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  function escapeAttribute(
    value
  ) {

    return safe(
      value
    );

  }


  function escapeJs(
    value
  ) {

    return String(
      value || ''
    )
      .replace(
        /\\/g,
        '\\\\'
      )
      .replace(
        /'/g,
        "\\'"
      );

  }


  function errorBox(
    message
  ) {

    return (
      '<div class="message error">' +
      safe(message) +
      '</div>'
    );

  }


  function showLoading(
    text
  ) {

    var el =
      document.getElementById(
        'globalLoading'
      );

    var textEl =
      document.getElementById(
        'loadingText'
      );

    if (textEl) {
      textEl.textContent =

        'Memuat...';
    }

    if (el) {
      el.classList.remove(
        'hidden'
      );
    }

  }


  function hideLoading() {

    var el =
      document.getElementById(
        'globalLoading'
      );

    if (el) {
      el.classList.add(
        'hidden'
      );
    }

  }


  function showToast(
    message,
    type
  ) {

    var toast =
      document.getElementById(
        'toast'
      );

    if (!toast) {
      return;
    }

    clearTimeout(
      toastTimer
    );

    toast.textContent =
      message || '';

    toast.className =
      'toast show ' +
      (
        type || ''
      );

    toastTimer =
      setTimeout(
        function () {

          toast.classList.remove(
            'show'
          );

        },
        3500
      );

  }


  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }

    if (
      typeof error ===
      'string'
    ) {

      return error;

    }

    return (
      error.message ||
      'Terjadi kesalahan pada server.'
    );

  }


  function base64ToArrayBuffer(
    base64
  ) {

    var binary =
      atob(base64);

    var len =
      binary.length;

    var bytes =
      new Uint8Array(
        len
      );

    for (
      var i = 0;
      i < len;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(i);

    }

    return bytes;

  }
