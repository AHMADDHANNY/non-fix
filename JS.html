<script>

(function () {

  'use strict';


  /* =========================================================
     STORAGE
     ========================================================= */

  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  /* =========================================================
     ELEMENT
     ========================================================= */

  var form =
    document.getElementById(
      'loginForm'
    );

  var usernameInput =
    document.getElementById(
      'username'
    );

  var passwordInput =
    document.getElementById(
      'password'
    );

  var loginButton =
    document.getElementById(
      'loginButton'
    );

  var loginButtonText =
    document.getElementById(
      'loginButtonText'
    );

  var loginSpinner =
    document.getElementById(
      'loginSpinner'
    );

  var loginMessage =
    document.getElementById(
      'loginMessage'
    );

  var togglePassword =
    document.getElementById(
      'togglePassword'
    );


  /* =========================================================
     INIT
     ========================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {

    setupPasswordToggle();

    setupLoginForm();

    loadAppName();

    checkExistingSession();

  }


  /* =========================================================
     PASSWORD
     ========================================================= */

  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {

      return;

    }


    togglePassword.addEventListener(
      'click',
      function () {

        var visible =
          passwordInput.type ===
          'text';


        passwordInput.type =
          visible
            ? 'password'
            : 'text';


        togglePassword.textContent =
          visible
            ? '👁'
            : '🙈';

      }
    );

  }


  /* =========================================================
     FORM
     ========================================================= */

  function setupLoginForm() {

    if (!form) {

      return;

    }


    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        login();

      }
    );

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  function login() {

    var username =
      usernameInput
        ? usernameInput.value.trim()
        : '';

    var password =
      passwordInput
        ? passwordInput.value
        : '';


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );

      if (usernameInput) {
        usernameInput.focus();
      }

      return;

    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );

      if (passwordInput) {
        passwordInput.focus();
      }

      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          setLoading(false);


          if (
            !response ||
            response.success !== true
          ) {

            showError(
              response &&
              response.message
                ? response.message
                : 'Username atau password salah.'
            );


            if (passwordInput) {

              passwordInput.value = '';

              passwordInput.focus();

            }

            return;

          }


          if (!response.token) {

            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );

            return;

          }


          var user =
            response.user || {};


          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            showError(
              'Role akun tidak valid.'
            );

            return;

          }


          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              response.token
            );


            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(
                user
              )
            );

          } catch (error) {

            showError(
              'Session tidak dapat disimpan di browser.'
            );

            return;

          }


          showSuccess(
            'Login berhasil. Membuka aplikasi...'
          );


          setTimeout(
            function () {

              redirectByRole(
                user
              );

            },
            300
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            normalizeError(
              error
            )
          );

        }
      )

      .login(
        username,
        password
      );

  }


  /* =========================================================
     EXISTING SESSION
     ========================================================= */

  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {

      return;

    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            saveUser(
              response.user
            );


            redirectByRole(
              response.user
            );

          } else {

            clearSession();

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Jangan ganggu halaman login
           * jika validasi session gagal.
           */

        }
      )

      .verifySession(
        token
      );

  }


  /* =========================================================
     REDIRECT ROLE
     ========================================================= */

  function redirectByRole(
    user
  ) {

    if (!user) {

      showError(
        'Data pengguna tidak tersedia.'
      );

      return;

    }


    var role =
      String(
        user.role || ''
      )
      .trim()
      .toLowerCase();


    var targetPage = '';


    if (
      role === 'admin'
    ) {

      targetPage =
        'DashboardAdmin';

    } else if (
      role === 'pegawai'
    ) {

      targetPage =
        'DashboardPegawai';

    } else {

      clearSession();

      showError(
        'Role pengguna tidak dikenali.'
      );

      return;

    }


    var baseUrl =
      window.location.href
        .split('?')[0];


    window.top.location.href =
      baseUrl +
      '?page=' +
      encodeURIComponent(
        targetPage
      );

  }


  /*
   * Expose supaya bisa digunakan
   * jika diperlukan oleh halaman lain.
   */
  window.redirectByRole =
    redirectByRole;


  /* =========================================================
     APP NAME
     ========================================================= */

  function loadAppName() {

    google.script.run

      .withSuccessHandler(
        function (name) {

          if (!name) {

            return;

          }


          var element =
            document.getElementById(
              'appName'
            );


          if (element) {

            element.textContent =
              name;

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Tidak perlu menampilkan error.
           * Nama default tetap digunakan.
           */

        }
      )

      .getNamaApp();

  }


  /* =========================================================
     TOKEN
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (error) {

      return '';

    }

  }


  /* =========================================================
     USER
     ========================================================= */

  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (error) {}

  }


  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );

      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (error) {}

  }


  /* =========================================================
     LOADING
     ========================================================= */

  function setLoading(
    loading
  ) {

    if (loginButton) {

      loginButton.disabled =
        loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  /* =========================================================
     MESSAGE
     ========================================================= */

  function showError(
    message
  ) {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  function showSuccess(
    message
  ) {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      message ||
      'Login berhasil.';


    loginMessage.className =
      'message success';

  }


  function clearMessage() {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      '';


    loginMessage.className =
      'message hidden';

  }


  /* =========================================================
     ERROR
     ========================================================= */

  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error ===
      'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  /* =========================================================
     GLOBAL API
     ========================================================= */

  window.AbsensiApp = {

    getToken:
      getToken,

    getUser:
      function () {

        try {

          var raw =
            localStorage.getItem(
              STORAGE_USER
            );


          return raw
            ? JSON.parse(raw)
            : null;

        } catch (error) {

          return null;

        }

      },

    clearSession:
      clearSession,

    redirectByRole:
      redirectByRole

  };


})();

</script>
