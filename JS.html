<script>

(function () {

  'use strict';


  /* =========================================================
     STORAGE
     ========================================================= */

  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  /* =========================================================
     ELEMENT
     ========================================================= */

  var form =
    document.getElementById(
      'loginForm'
    );

  var usernameInput =
    document.getElementById(
      'username'
    );

  var passwordInput =
    document.getElementById(
      'password'
    );

  var loginButton =
    document.getElementById(
      'loginButton'
    );

  var loginButtonText =
    document.getElementById(
      'loginButtonText'
    );

  var loginSpinner =
    document.getElementById(
      'loginSpinner'
    );

  var loginMessage =
    document.getElementById(
      'loginMessage'
    );

  var togglePassword =
    document.getElementById(
      'togglePassword'
    );


  /* =========================================================
     INITIAL
     ========================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {

    setupPasswordToggle();

    setupLoginForm();

    loadAppName();

    checkExistingSession();

  }


  /* =========================================================
     PASSWORD TOGGLE
     ========================================================= */

  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {

      return;

    }


    togglePassword.addEventListener(
      'click',
      function () {

        var isVisible =
          passwordInput.type ===
          'text';


        passwordInput.type =
          isVisible
            ? 'password'
            : 'text';


        togglePassword.textContent =
          isVisible
            ? '👁'
            : '🙈';

      }
    );

  }


  /* =========================================================
     LOGIN FORM
     ========================================================= */

  function setupLoginForm() {

    if (!form) {
      return;
    }


    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        login();

      }
    );

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  function login() {

    if (
      !usernameInput ||
      !passwordInput
    ) {

      showError(
        'Form login tidak ditemukan.'
      );

      return;

    }


    var username =
      usernameInput.value.trim();

    var password =
      passwordInput.value;


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );

      usernameInput.focus();

      return;

    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );

      passwordInput.focus();

      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          setLoading(false);


          if (
            !response ||
            response.success !== true
          ) {

            showError(
              response &&
              response.message
                ? response.message
                : 'Username atau password salah.'
            );


            passwordInput.value = '';

            passwordInput.focus();

            return;

          }


          /*
           * Token WAJIB dikembalikan server.
           */
          if (!response.token) {

            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );

            return;

          }


          var user =
            response.user || {};


          /*
           * Role WAJIB valid.
           */
          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            clearSession();

            showError(
              'Role akun tidak valid.'
            );

            return;

          }


          /*
           * Simpan token dan user.
           */
          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              String(
                response.token
              )
            );


            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(
                user
              )
            );

          } catch (storageError) {

            showError(
              'Session tidak dapat disimpan di browser.'
            );

            return;

          }


          showSuccess(
            'Login berhasil. Membuka aplikasi...'
          );


          /*
           * Redirect berdasarkan role.
           */
          setTimeout(
            function () {

              redirectByRole(
                user
              );

            },
            300
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            normalizeError(
              error
            )
          );

        }
      )

      .login(
        username,
        password
      );

  }


  /* =========================================================
     CEK SESSION LAMA
     ========================================================= */

  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {

      return;

    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            saveUser(
              response.user
            );


            redirectByRole(
              response.user
            );

          } else {

            clearSession();

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Jangan tampilkan error saat
           * pengecekan session gagal.
           *
           * User tetap berada di halaman login.
           */

        }
      )

      .verifySession(
        token
      );

  }


  /* =========================================================
     REDIRECT BERDASARKAN ROLE
     ========================================================= */

  function redirectByRole(
    user
  ) {

    if (!user) {

      showError(
        'Data pengguna tidak tersedia.'
      );

      return;

    }


    var role =
      String(
        user.role || ''
      )
      .trim()
      .toLowerCase();


    var targetPage = '';


    if (
      role === 'admin'
    ) {

      targetPage =
        'DashboardAdmin';

    } else if (
      role === 'pegawai'
    ) {

      targetPage =
        'DashboardPegawai';

    } else {

      clearSession();

      showError(
        'Role pengguna tidak dikenali.'
      );

      return;

    }


    /*
     * Ambil URL Web App saat ini.
     *
     * Token TIDAK dimasukkan ke URL.
     *
     * ?page=DashboardAdmin hanya menentukan
     * halaman yang dirender.
     *
     * Keamanan tetap dilakukan oleh
     * verifySession() pada dashboard.
     */
    var baseUrl =
      window.location.href
        .split('?')[0];


    var targetUrl =
      baseUrl +
      '?page=' +
      encodeURIComponent(
        targetPage
      );


    /*
     * Gunakan top location karena
     * Apps Script Web App berjalan
     * dalam userCodeAppPanel.
     */
    try {

      window.top.location.href =
        targetUrl;

    } catch (error) {

      window.location.href =
        targetUrl;

    }

  }


  /*
   * Buat fungsi redirect dapat dipakai
   * oleh script lain jika diperlukan.
   */
  window.redirectByRole =
    redirectByRole;


  /* =========================================================
     LOAD NAMA APLIKASI
     ========================================================= */

  function loadAppName() {

    /*
     * Jangan memanggil getNamaAppSafe_()
     * langsung dari client karena fungsi
     * yang diakhiri underscore merupakan
     * fungsi private Apps Script.
     *
     * Coba gunakan fungsi public getNamaApp().
     *
     * Jika fungsi tersebut belum tersedia,
     * abaikan dan gunakan nama default.
     */

    if (
      typeof google === 'undefined' ||
      !google.script ||
      !google.script.run
    ) {

      return;

    }


    google.script.run

      .withSuccessHandler(
        function (name) {

          if (!name) {
            return;
          }


          var element =
            document.getElementById(
              'appName'
            );


          if (element) {

            element.textContent =
              String(name);

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Tidak fatal.
           * Nama default dari HTML tetap digunakan.
           */

        }
      )

      .getNamaApp();

  }


  /* =========================================================
     GET TOKEN
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (error) {

      return '';

    }

  }


  /* =========================================================
     SAVE USER
     ========================================================= */

  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (error) {

      /*
       * Tidak fatal.
       */

    }

  }


  /* =========================================================
     GET USER
     ========================================================= */

  function getUser() {

    try {

      var raw =
        localStorage.getItem(
          STORAGE_USER
        );


      return raw
        ? JSON.parse(raw)
        : null;

    } catch (error) {

      return null;

    }

  }


  /* =========================================================
     CLEAR SESSION
     ========================================================= */

  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );


      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (error) {

      /*
       * Tidak fatal.
       */

    }

  }


  /* =========================================================
     LOADING
     ========================================================= */

  function setLoading(
    loading
  ) {

    if (loginButton) {

      loginButton.disabled =
        loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  /* =========================================================
     ERROR MESSAGE
     ========================================================= */

  function showError(
    message
  ) {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  /* =========================================================
     SUCCESS MESSAGE
     ========================================================= */

  function showSuccess(
    message
  ) {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      message ||
      'Login berhasil.';


    loginMessage.className =
      'message success';

  }


  /* =========================================================
     CLEAR MESSAGE
     ========================================================= */

  function clearMessage() {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      '';


    loginMessage.className =
      'message hidden';

  }


  /* =========================================================
     NORMALIZE ERROR
     ========================================================= */

  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error ===
      'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  /* =========================================================
     GLOBAL ABSENSI APP
     ========================================================= */

  window.AbsensiApp = {

    getToken:
      getToken,

    getUser:
      getUser,

    saveUser:
      saveUser,

    clearSession:
      clearSession,

    redirectByRole:
      redirectByRole

  };


})();

</script>
