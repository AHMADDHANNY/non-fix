<script>

(function () {

  'use strict';


  /* =========================================================
     STORAGE
     ========================================================= */

  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  /* =========================================================
     ELEMENT
     ========================================================= */

  var form =
    document.getElementById('loginForm');

  var usernameInput =
    document.getElementById('username');

  var passwordInput =
    document.getElementById('password');

  var loginButton =
    document.getElementById('loginButton');

  var loginButtonText =
    document.getElementById('loginButtonText');

  var loginSpinner =
    document.getElementById('loginSpinner');

  var loginMessage =
    document.getElementById('loginMessage');

  var togglePassword =
    document.getElementById('togglePassword');


  /* =========================================================
     INIT
     ========================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    function () {

      setupPasswordToggle();

      setupLoginForm();

      checkExistingSession();

    }
  );


  /* =========================================================
     PASSWORD TOGGLE
     ========================================================= */

  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {
      return;
    }

    togglePassword.addEventListener(
      'click',
      function () {

        var isPassword =
          passwordInput.type === 'password';

        passwordInput.type =
          isPassword
            ? 'text'
            : 'password';

        togglePassword.textContent =
          isPassword
            ? '🙈'
            : '👁';

        togglePassword.setAttribute(
          'aria-pressed',
          isPassword
            ? 'true'
            : 'false'
        );

      }
    );

  }


  /* =========================================================
     LOGIN FORM
     ========================================================= */

  function setupLoginForm() {

    if (!form) {
      return;
    }

    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        login();

      }
    );

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  function login() {

    if (
      !usernameInput ||
      !passwordInput
    ) {
      return;
    }

    var username =
      usernameInput.value.trim();

    var password =
      passwordInput.value;


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );

      usernameInput.focus();

      return;

    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );

      passwordInput.focus();

      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          setLoading(false);


          if (
            !response ||
            response.success !== true
          ) {

            showError(
              response &&
              response.message
                ? response.message
                : 'Login gagal.'
            );

            passwordInput.value = '';

            passwordInput.focus();

            return;

          }


          if (!response.token) {

            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );

            return;

          }


          if (!response.user) {

            showError(
              'Data pengguna tidak diterima dari server.'
            );

            return;

          }


          var user =
            response.user;


          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            showError(
              'Role pengguna tidak dikenali.'
            );

            return;

          }


          /* =================================================
             SIMPAN SESSION
             ================================================= */

          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              String(response.token)
            );

            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(user)
            );

          } catch (storageError) {

            showError(
              'Browser tidak mengizinkan penyimpanan session.'
            );

            return;

          }


          showSuccess(
            'Login berhasil. Membuka aplikasi...'
          );


          /*
           * Beri sedikit waktu agar pesan berhasil
           * sempat terlihat.
           */
          setTimeout(
            function () {

              redirectByRole(user);

            },
            300
          );

        }
      )


      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            normalizeError(error)
          );

        }
      )


      .login(
        username,
        password
      );

  }


  /* =========================================================
     SESSION LAMA
     ========================================================= */

  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {
      return;
    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            var user =
              response.user;

            saveUser(user);

            redirectByRole(user);

            return;

          }


          clearSession();

        }
      )


      .withFailureHandler(
        function () {

          /*
           * Jangan langsung menghapus session
           * jika server sementara gagal.
           */

        }
      )


      .verifySession(
        token
      );

  }


  /* =========================================================
     REDIRECT BERDASARKAN ROLE
     ========================================================= */

  function redirectByRole(user) {

    if (!user) {

      clearSession();

      showError(
        'Data pengguna tidak tersedia.'
      );

      return;

    }


    var role =
      String(
        user.role || ''
      )
      .trim()
      .toLowerCase();


    var targetPage = '';


    if (role === 'admin') {

      targetPage =
        'DashboardAdmin';

    } else if (role === 'pegawai') {

      targetPage =
        'DashboardPegawai';

    } else {

      clearSession();

      showError(
        'Role pengguna tidak dikenali.'
      );

      return;

    }


    /*
     * =====================================================
     * ROUTING
     * =====================================================
     *
     * Login -> Dashboard berdasarkan role.
     *
     * URL ?page=... hanya menentukan file HTML.
     *
     * Keamanan TETAP dilakukan oleh:
     *
     * DashboardAdmin -> verifySession + role admin
     * DashboardPegawai -> verifySession + role pegawai
     *
     * Jadi mengetik URL dashboard secara manual
     * tidak otomatis memberikan akses.
     */

    var currentUrl =
      window.location.href;

    var baseUrl =
      currentUrl.split('?')[0];


    var targetUrl =
      baseUrl +
      '?page=' +
      encodeURIComponent(
        targetPage
      );


    window.top.location.href =
      targetUrl;

  }


  /* =========================================================
     STORAGE
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (e) {

      return '';

    }

  }


  function getUser() {

    try {

      var raw =
        localStorage.getItem(
          STORAGE_USER
        );

      if (!raw) {
        return null;
      }

      return JSON.parse(raw);

    } catch (e) {

      return null;

    }

  }


  function saveUser(user) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (e) {}

  }


  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );

      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (e) {}

  }


  /* =========================================================
     UI LOADING
     ========================================================= */

  function setLoading(loading) {

    if (loginButton) {

      loginButton.disabled =
        loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  /* =========================================================
     UI MESSAGE
     ========================================================= */

  function showError(message) {

    if (!loginMessage) {

      console.error(
        message
      );

      return;

    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  function showSuccess(message) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Berhasil.';


    loginMessage.className =
      'message success';

  }


  function clearMessage() {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      '';


    loginMessage.className =
      'message hidden';

  }


  /* =========================================================
     ERROR
     ========================================================= */

  function normalizeError(error) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error === 'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  /* =========================================================
     GLOBAL API
     ========================================================= */

  window.AbsensiApp = {

    getToken:
      getToken,

    getUser:
      getUser,

    clearSession:
      clearSession,

    logoutLocal:
      clearSession,

    redirectByRole:
      redirectByRole

  };


})();

</script>
