<script>

(function () {

  'use strict';


  /* =========================================================
     STORAGE
     ========================================================= */

  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  /* =========================================================
     ELEMENT
     ========================================================= */

  var form =
    document.getElementById(
      'loginForm'
    );

  var usernameInput =
    document.getElementById(
      'username'
    );

  var passwordInput =
    document.getElementById(
      'password'
    );

  var loginButton =
    document.getElementById(
      'loginButton'
    );

  var loginButtonText =
    document.getElementById(
      'loginButtonText'
    );

  var loginSpinner =
    document.getElementById(
      'loginSpinner'
    );

  var loginMessage =
    document.getElementById(
      'loginMessage'
    );

  var togglePassword =
    document.getElementById(
      'togglePassword'
    );


  /* =========================================================
     INIT
     ========================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {

    setupPasswordToggle();

    setupLoginForm();

    loadAppName();

    checkExistingSession();

  }


  /* =========================================================
     PASSWORD TOGGLE
     ========================================================= */

  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {

      return;

    }


    togglePassword.addEventListener(
      'click',
      function () {

        var visible =
          passwordInput.type ===
          'text';


        passwordInput.type =
          visible
            ? 'password'
            : 'text';


        togglePassword.textContent =
          visible
            ? '👁'
            : '🙈';

      }
    );

  }


  /* =========================================================
     LOGIN FORM
     ========================================================= */

  function setupLoginForm() {

    if (!form) {

      return;

    }


    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        login();

      }
    );

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  function login() {

    var username =
      usernameInput
        ? usernameInput.value.trim()
        : '';


    var password =
      passwordInput
        ? passwordInput.value
        : '';


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );


      if (usernameInput) {

        usernameInput.focus();

      }


      return;

    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );


      if (passwordInput) {

        passwordInput.focus();

      }


      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            response.success !== true
          ) {

            setLoading(false);


            showError(
              response &&
              response.message
                ? response.message
                : 'Username atau password salah.'
            );


            if (passwordInput) {

              passwordInput.value = '';

              passwordInput.focus();

            }


            return;

          }


          /*
           * Login berhasil tetapi server
           * tidak mengembalikan token.
           */

          if (!response.token) {

            setLoading(false);


            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );


            return;

          }


          var user =
            response.user || {};


          /*
           * Normalisasi role.
           */

          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          /*
           * Hanya dua role yang diperbolehkan.
           */

          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            setLoading(false);

            clearSession();


            showError(
              'Role akun tidak valid.'
            );


            return;

          }


          /*
           * Simpan session.
           */

          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              String(
                response.token
              )
            );


            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(
                user
              )
            );

          } catch (error) {

            setLoading(false);


            showError(
              'Session tidak dapat disimpan di browser.'
            );


            return;

          }


          showSuccess(
            'Login berhasil. Membuka aplikasi...'
          );


          /*
           * Redirect berdasarkan role.
           */

          redirectByRole(
            user
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);


          showError(
            normalizeError(
              error
            )
          );

        }
      )

      .login(
        username,
        password
      );

  }


  /* =========================================================
     REDIRECT BY ROLE
     ========================================================= */

  function redirectByRole(
    user
  ) {

    if (!user) {

      setLoading(false);


      showError(
        'Data pengguna tidak tersedia.'
      );


      return;

    }


    var role =
      String(
        user.role || ''
      )
      .trim()
      .toLowerCase();


    var targetPage = '';


    /*
     * ADMIN
     */

    if (
      role === 'admin'
    ) {

      targetPage =
        'DashboardAdmin';

    }


    /*
     * PEGAWAI
     */

    else if (
      role === 'pegawai'
    ) {

      targetPage =
        'DashboardPegawai';

    }


    /*
     * ROLE TIDAK VALID
     */

    else {

      clearSession();

      setLoading(false);


      showError(
        'Role pengguna tidak dikenali.'
      );


      return;

    }


    setLoading(true);


    /*
     * Ambil URL deployment Web App
     * dari server.
     *
     * JANGAN mengambil:
     *
     * window.location.href
     *
     * karena di Apps Script dapat berupa:
     *
     * userCodeAppPanel
     */

    google.script.run

      .withSuccessHandler(
        function (webAppUrl) {

          if (!webAppUrl) {

            setLoading(false);


            showError(
              'URL Web App tidak tersedia. Pastikan fungsi getWebAppUrl() ada di Code.gs.'
            );


            return;

          }


          webAppUrl =
            String(
              webAppUrl
            ).trim();


          if (!webAppUrl) {

            setLoading(false);


            showError(
              'URL Web App kosong.'
            );


            return;

          }


          var separator =
            webAppUrl.indexOf('?') >= 0
              ? '&'
              : '?';


          var targetUrl =
            webAppUrl +
            separator +
            'page=' +
            encodeURIComponent(
              targetPage
            );


          /*
           * replace(), bukan href biasa.
           *
           * Ini mencegah URL userCodeAppPanel
           * menjadi dasar navigasi.
           */

          try {

            window.top.location.replace(
              targetUrl
            );

          } catch (error) {

            /*
             * Fallback jika top window tidak
             * dapat diakses.
             */

            window.location.replace(
              targetUrl
            );

          }

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);


          showError(
            'Gagal membuka aplikasi: ' +
            normalizeError(
              error
            )
          );

        }
      )

      .getWebAppUrl();

  }


  /* =========================================================
     EXISTING SESSION
     ========================================================= */

  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {

      return;

    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            var user =
              response.user;


            saveUser(
              user
            );


            redirectByRole(
              user
            );

          } else {

            clearSession();

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Jangan menampilkan error
           * ketika halaman Login pertama
           * dibuka.
           */

        }
      )

      .verifySession(
        token
      );

  }


  /* =========================================================
     LOAD APP NAME
     ========================================================= */

  function loadAppName() {

    google.script.run

      .withSuccessHandler(
        function (name) {

          var element =
            document.getElementById(
              'appName'
            );


          if (!element) {

            return;

          }


          element.textContent =
            name ||
            'Aplikasi Absensi';

        }
      )

      .withFailureHandler(
        function (error) {

          /*
           * Nama aplikasi bukan bagian
           * dari proses login.
           *
           * Jadi jika gagal, login tetap
           * dapat digunakan.
           */

          console.warn(
            'Gagal mengambil nama aplikasi:',
            error
          );

        }
      )

      .getNamaApp();

  }


  /* =========================================================
     STORAGE - GET TOKEN
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (error) {

      return '';

    }

  }


  /* =========================================================
     STORAGE - SAVE USER
     ========================================================= */

  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (error) {

      /*
       * Tidak menghentikan aplikasi.
       */

    }

  }


  /* =========================================================
     STORAGE - GET USER
     ========================================================= */

  function getUser() {

    try {

      var raw =
        localStorage.getItem(
          STORAGE_USER
        );


      return raw
        ? JSON.parse(raw)
        : null;

    } catch (error) {

      return null;

    }

  }


  /* =========================================================
     STORAGE - CLEAR SESSION
     ========================================================= */

  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );


      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (error) {

      /*
       * Abaikan error localStorage.
       */

    }

  }


  /* =========================================================
     LOADING
     ========================================================= */

  function setLoading(
    loading
  ) {

    if (loginButton) {

      loginButton.disabled =
        loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  /* =========================================================
     MESSAGE - ERROR
     ========================================================= */

  function showError(
    message
  ) {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  /* =========================================================
     MESSAGE - SUCCESS
     ========================================================= */

  function showSuccess(
    message
  ) {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      message ||
      'Login berhasil.';


    loginMessage.className =
      'message success';

  }


  /* =========================================================
     MESSAGE - CLEAR
     ========================================================= */

  function clearMessage() {

    if (!loginMessage) {

      return;

    }


    loginMessage.textContent =
      '';


    loginMessage.className =
      'message hidden';

  }


  /* =========================================================
     ERROR NORMALIZATION
     ========================================================= */

  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error ===
      'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  /* =========================================================
     PUBLIC API
     ========================================================= */

  window.AbsensiApp = {

    getToken:
      getToken,


    getUser:
      getUser,


    clearSession:
      clearSession,


    redirectByRole:
      redirectByRole

  };


  /*
   * Kompatibilitas dengan kode lama.
   */

  window.redirectByRole =
    redirectByRole;


})();

</script>
