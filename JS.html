<script>

(function () {

  'use strict';


  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  var form =
    document.getElementById(
      'loginForm'
    );

  var usernameInput =
    document.getElementById(
      'username'
    );

  var passwordInput =
    document.getElementById(
      'password'
    );

  var loginButton =
    document.getElementById(
      'loginButton'
    );

  var loginButtonText =
    document.getElementById(
      'loginButtonText'
    );

  var loginSpinner =
    document.getElementById(
      'loginSpinner'
    );

  var loginMessage =
    document.getElementById(
      'loginMessage'
    );

  var togglePassword =
    document.getElementById(
      'togglePassword'
    );


  var pendingTargetUrl =
    '';

  var redirectReady =
    false;


  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {

    setupPasswordToggle();

    setupLoginForm();

    loadAppName();

    checkExistingSession();

  }


  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {

      return;

    }


    togglePassword.addEventListener(
      'click',
      function () {

        var visible =
          passwordInput.type ===
          'text';


        passwordInput.type =
          visible
            ? 'password'
            : 'text';


        togglePassword.textContent =
          visible
            ? '👁'
            : '🙈';

      }
    );

  }


  function setupLoginForm() {

    if (!form) {
      return;
    }


    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        if (
          redirectReady &&
          pendingTargetUrl
        ) {

          navigateTop(
            pendingTargetUrl
          );

          return;

        }


        login();

      }
    );

  }


  function login() {

    var username =
      usernameInput
        ? usernameInput.value.trim()
        : '';

    var password =
      passwordInput
        ? passwordInput.value
        : '';


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );

      if (usernameInput) {
        usernameInput.focus();
      }

      return;

    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );

      if (passwordInput) {
        passwordInput.focus();
      }

      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            response.success !== true
          ) {

            setLoading(false);

            showError(
              response &&
              response.message
                ? response.message
                : 'Username atau password salah.'
            );

            if (passwordInput) {

              passwordInput.value = '';

              passwordInput.focus();

            }

            return;

          }


          if (!response.token) {

            setLoading(false);

            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );

            return;

          }


          var user =
            response.user || {};


          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            clearSession();

            setLoading(false);

            showError(
              'Role akun tidak valid.'
            );

            return;

          }


          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              String(
                response.token
              )
            );


            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(
                user
              )
            );

          } catch (error) {

            setLoading(false);

            showError(
              'Session tidak dapat disimpan di browser.'
            );

            return;

          }


          prepareRedirect(
            user
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            normalizeError(
              error
            )
          );

        }
      )

      .login(
        username,
        password
      );

  }


  /*
   * ==========================================================
   * REDIRECT
   * ==========================================================
   *
   * Tidak menggunakan window.top.location.
   *
   * Apps Script IFRAME membutuhkan navigasi top-level
   * melalui aksi user dengan target="_top".
   */
  function prepareRedirect(
    user
  ) {

    var role =
      String(
        user &&
        user.role || ''
      )
      .trim()
      .toLowerCase();


    var targetPage =
      '';


    if (
      role === 'admin'
    ) {

      targetPage =
        'DashboardAdmin';

    } else if (
      role === 'pegawai'
    ) {

      targetPage =
        'DashboardPegawai';

    } else {

      clearSession();

      setLoading(false);

      showError(
        'Role pengguna tidak dikenali.'
      );

      return;

    }


    var base =
      String(
        window.ABSENSI_WEB_APP_URL ||
        ''
      ).trim();


    if (!base) {

      google.script.run

        .withSuccessHandler(
          function (url) {

            if (!url) {

              setLoading(false);

              showError(
                'URL Web App tidak tersedia.'
              );

              return;

            }


            finishRedirect(
              url,
              targetPage
            );

          }
        )

        .withFailureHandler(
          function (error) {

            setLoading(false);

            showError(
              normalizeError(
                error
              )
            );

          }
        )

        .getWebAppUrl();

      return;

    }


    finishRedirect(
      base,
      targetPage
    );

  }


  function finishRedirect(
    base,
    page
  ) {

    var separator =
      base.indexOf('?') >= 0
        ? '&'
        : '?';


    pendingTargetUrl =
      base +
      separator +
      'page=' +
      encodeURIComponent(
        page
      );


    redirectReady =
      true;


    setLoading(false);


    if (loginButton) {

      loginButton.disabled =
        false;

      loginButton.type =
        'button';

      loginButton.onclick =
        function () {

          navigateTop(
            pendingTargetUrl
          );

        };

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        page === 'DashboardAdmin'
          ? 'Buka Dashboard Admin'
          : 'Buka Dashboard Pegawai';

    }


    if (loginSpinner) {

      loginSpinner.classList.add(
        'hidden'
      );

    }


    showSuccess(
      'Login berhasil. Klik tombol untuk membuka aplikasi.'
    );

  }


  function navigateTop(
    url
  ) {

    if (!url) {
      return;
    }


    /*
     * Link dibuat dan diklik dari aksi user.
     * target="_top" diizinkan oleh Apps Script IFRAME.
     */
    var link =
      document.createElement(
        'a'
      );


    link.href =
      url;

    link.target =
      '_top';

    link.rel =
      'noopener';


    link.style.display =
      'none';


    document.body.appendChild(
      link
    );


    link.click();

  }


  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {
      return;
    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            saveUser(
              response.user
            );


            prepareRedirect(
              response.user
            );

          } else {

            clearSession();

          }

        }
      )

      .withFailureHandler(
        function () {

          clearSession();

        }
      )

      .verifySession(
        token
      );

  }


  function loadAppName() {

    google.script.run

      .withSuccessHandler(
        function (name) {

          var element =
            document.getElementById(
              'appName'
            );


          if (!element) {
            return;
          }


          element.textContent =
            name ||
            'Aplikasi Absensi';

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Nama default tetap dipakai.
           */

        }
      )

      .getNamaApp();

  }


  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (error) {

      return '';

    }

  }


  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (error) {}

  }


  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );

      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (error) {}

  }


  function setLoading(
    loading
  ) {

    if (loginButton) {

      loginButton.disabled =
        loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  function showError(
    message
  ) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  function showSuccess(
    message
  ) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Login berhasil.';


    loginMessage.className =
      'message success';

  }


  function clearMessage() {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      '';


    loginMessage.className =
      'message hidden';

  }


  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error ===
      'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  window.AbsensiApp = {

    getToken:
      getToken,

    getUser:
      function () {

        try {

          var raw =
            localStorage.getItem(
              STORAGE_USER
            );


          return raw
            ? JSON.parse(raw)
            : null;

        } catch (error) {

          return null;

        }

      },

    clearSession:
      clearSession,

    redirectByRole:
      prepareRedirect

  };


  window.redirectByRole =
    prepareRedirect;


})();

</script>
