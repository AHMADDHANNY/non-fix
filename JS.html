<script>

(function () {

  'use strict';

  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  var form =
    document.getElementById('loginForm');

  var usernameInput =
    document.getElementById('username');

  var passwordInput =
    document.getElementById('password');

  var loginButton =
    document.getElementById('loginButton');

  var loginButtonText =
    document.getElementById('loginButtonText');

  var loginSpinner =
    document.getElementById('loginSpinner');

  var loginMessage =
    document.getElementById('loginMessage');

  var togglePassword =
    document.getElementById('togglePassword');


  /* =========================================================
     INIT
     ========================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {

    setupPasswordToggle();

    setupLoginForm();

    loadAppName();

    checkExistingSession();

  }


  /* =========================================================
     PASSWORD TOGGLE
     ========================================================= */

  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {
      return;
    }


    togglePassword.addEventListener(
      'click',
      function () {

        var visible =
          passwordInput.type === 'text';


        passwordInput.type =
          visible
            ? 'password'
            : 'text';


        togglePassword.textContent =
          visible
            ? '👁'
            : '🙈';

      }
    );

  }


  /* =========================================================
     LOGIN FORM
     ========================================================= */

  function setupLoginForm() {

    if (!form) {
      return;
    }


    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        login();

      }
    );

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  function login() {

    var username =
      usernameInput
        ? usernameInput.value.trim()
        : '';

    var password =
      passwordInput
        ? passwordInput.value
        : '';


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );

      if (usernameInput) {
        usernameInput.focus();
      }

      return;

    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );

      if (passwordInput) {
        passwordInput.focus();
      }

      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          setLoading(false);


          if (
            !response ||
            response.success !== true
          ) {

            showError(
              response &&
              response.message
                ? response.message
                : 'Username atau password salah.'
            );


            if (passwordInput) {
              passwordInput.value = '';
              passwordInput.focus();
            }

            return;

          }


          if (
            !response.token
          ) {

            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );

            return;

          }


          var user =
            response.user || {};


          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            clearSession();

            showError(
              'Role akun tidak valid.'
            );

            return;

          }


          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              String(
                response.token
              )
            );


            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(user)
            );

          } catch (error) {

            showError(
              'Session tidak dapat disimpan di browser.'
            );

            return;

          }


          showSuccess(
            'Login berhasil. Membuka aplikasi...'
          );


          /*
           * JANGAN lagi memakai:
           *
           * window.location.href
           *
           * untuk membentuk URL dari
           * userCodeAppPanel.
           *
           * Ambil URL deployment Web App
           * langsung dari server.
           */

          redirectByRole(
            user
          );

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            normalizeError(error)
          );

        }
      )

      .login(
        username,
        password
      );

  }


  /* =========================================================
     REDIRECT BY ROLE
     ========================================================= */

  function redirectByRole(
    user
  ) {

    if (!user) {

      showError(
        'Data pengguna tidak tersedia.'
      );

      return;

    }


    var role =
      String(
        user.role || ''
      )
      .trim()
      .toLowerCase();


    var targetPage = '';


    if (
      role === 'admin'
    ) {

      targetPage =
        'DashboardAdmin';

    } else if (
      role === 'pegawai'
    ) {

      targetPage =
        'DashboardPegawai';

    } else {

      clearSession();

      showError(
        'Role pengguna tidak dikenali.'
      );

      return;

    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (webAppUrl) {

          if (!webAppUrl) {

            setLoading(false);

            showError(
              'URL Web App tidak tersedia.'
            );

            return;

          }


          var separator =
            webAppUrl.indexOf('?') >= 0
              ? '&'
              : '?';


          var targetUrl =
            webAppUrl +
            separator +
            'page=' +
            encodeURIComponent(
              targetPage
            );


          /*
           * URL ini adalah URL deployment
           * Web App, bukan userCodeAppPanel.
           */

          window.top.location.href =
            targetUrl;

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            'Gagal membuka aplikasi: ' +
            normalizeError(error)
          );

        }
      )

      .getWebAppUrl();

  }


  /* =========================================================
     EXISTING SESSION
     ========================================================= */

  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {
      return;
    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            saveUser(
              response.user
            );


            redirectByRole(
              response.user
            );

          } else {

            clearSession();

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Jangan tampilkan error
           * saat login pertama dibuka.
           */

        }
      )

      .verifySession(
        token
      );

  }


  /* =========================================================
     APP NAME
     ========================================================= */

  function loadAppName() {

    google.script.run

      .withSuccessHandler(
        function (name) {

          if (!name) {
            return;
          }


          var element =
            document.getElementById(
              'appName'
            );


          if (element) {

            element.textContent =
              name;

          }

        }
      )

      .withFailureHandler(
        function () {}
      )

      .getNamaAppSafe_();

  }


  /* =========================================================
     STORAGE
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (error) {

      return '';

    }

  }


  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (error) {}

  }


  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );


      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (error) {}

  }


  /* =========================================================
     LOADING
     ========================================================= */

  function setLoading(
    loading
  ) {

    if (loginButton) {

      loginButton.disabled =
        loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  /* =========================================================
     MESSAGE
     ========================================================= */

  function showError(
    message
  ) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  function showSuccess(
    message
  ) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Login berhasil.';


    loginMessage.className =
      'message success';

  }


  function clearMessage() {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      '';


    loginMessage.className =
      'message hidden';

  }


  /* =========================================================
     ERROR
     ========================================================= */

  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error ===
      'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  /* =========================================================
     PUBLIC API
     ========================================================= */

  window.AbsensiApp = {

    getToken:
      getToken,

    getUser:
      function () {

        try {

          var raw =
            localStorage.getItem(
              STORAGE_USER
            );


          return raw
            ? JSON.parse(raw)
            : null;

        } catch (error) {

          return null;

        }

      },

    clearSession:
      clearSession,

    redirectByRole:
      redirectByRole

  };


  /*
   * Kompatibilitas.
   */

  window.redirectByRole =
    redirectByRole;


})();

</script>
