<script>

window.AdminApp = (function () {

  'use strict';


  var initialized = false;

  var currentPage =
    'dashboard';

  var clockTimer =
    null;

  var toastTimer =
    null;

  var dashboardLoading =
    false;


  function init() {

    if (initialized) {

      /*
       * Kalau sudah pernah init,
       * tetap refresh dashboard.
       */

      loadDashboard();

      return;

    }


    initialized = true;


    var token =
      getToken();


    if (!token) {

      showToast(
        'Sesi tidak ditemukan.',
        'error'
      );

      return;

    }


    setupNavigation();

    setupQuickActions();

    setupMobileMenu();

    setupLogout();

    setupRefresh();

    startClock();

    loadStoredUser();

    verifyAdminSession(
      token
    );

  }


  function getToken() {

    try {

      return (
        localStorage.getItem(
          'absensi_session_token'
        ) || ''
      );

    } catch (e) {

      return '';

    }

  }


  function getUser() {

    try {

      var raw =
        localStorage.getItem(
          'absensi_session_user'
        );

      return raw
        ? JSON.parse(raw)
        : null;

    } catch (e) {

      return null;

    }

  }


  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        'absensi_session_user',
        JSON.stringify(
          user || {}
        )
      );

    } catch (e) {}

  }


  function clearSession() {

    try {

      localStorage.removeItem(
        'absensi_session_token'
      );

      localStorage.removeItem(
        'absensi_session_user'
      );

    } catch (e) {}

  }


  function verifyAdminSession(
    token
  ) {

    showLoading(
      'Memeriksa sesi admin...'
    );


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            !response ||
            response.valid !== true ||
            !response.user
          ) {

            hideLoading();

            clearSession();

            showToast(
              'Sesi tidak valid. Silakan login kembali.',
              'error'
            );

            setTimeout(
              logoutToLogin,
              1000
            );

            return;
          }


          var user =
            response.user;


          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin'
          ) {

            hideLoading();

            clearSession();

            showToast(
              'Akses hanya untuk administrator.',
              'error'
            );

            setTimeout(
              logoutToLogin,
              1000
            );

            return;
          }


          saveUser(
            user
          );

          applyUser(
            user
          );

          loadDashboard();

        }
      )

      .withFailureHandler(
        function (error) {

          hideLoading();

          showToast(
            normalizeError(error),
            'error'
          );

        }
      )

      .verifySession(
        token
      );

  }


  function applyUser(
    user
  ) {

    var name =
      String(
        user.nama ||
        user.username ||
        'Administrator'
      );


    setText(
      'welcomeName',
      name
    );

    setText(
      'topbarUserName',
      name
    );

    setText(
      'topbarUserRole',
      'Administrator'
    );


    var avatar =
      document.getElementById(
        'topbarAvatar'
      );


    if (!avatar) {
      return;
    }


    if (
      user.foto_profil
    ) {

      avatar.innerHTML =
        '<img src="' +
        escapeAttribute(
          user.foto_profil
        ) +
        '" alt="Foto profil">';

    } else {

      avatar.textContent =
        getInitial(
          name
        );

    }

  }


  function loadStoredUser() {

    var user =
      getUser();

    if (user) {

      applyUser(
        user
      );

    }

  }


  function loadDashboard() {

    if (dashboardLoading) {
      return;
    }


    var token =
      getToken();


    if (!token) {

      logoutToLogin();

      return;
    }


    dashboardLoading =
      true;


    showLoading(
      'Memuat dashboard...'
    );


    google.script.run

      .withSuccessHandler(
        function (response) {

          dashboardLoading =
            false;

          hideLoading();


          if (
            !response ||
            response.success !== true
          ) {

            showToast(
              response &&
              response.message
                ? response.message
                : 'Dashboard gagal dimuat.',
              'error'
            );

            return;
          }


          applyDashboard(
            response.data || {}
          );

        }
      )

      .withFailureHandler(
        function (error) {

          dashboardLoading =
            false;

          hideLoading();

          showToast(
            normalizeError(error),
            'error'
          );

        }
      )

      .getDashboardAdmin(
        token
      );

  }


  function applyDashboard(
    data
  ) {

    setText(
      'statPegawai',
      numberFormat(
        data.total_pegawai
      )
    );

    setText(
      'statHadir',
      numberFormat(
        data.hadir_hari_ini
      )
    );

    setText(
      'statTerlambat',
      numberFormat(
        data.terlambat_hari_ini
      )
    );

    setText(
      'statBelumAbsen',
      numberFormat(
        data.belum_absen_hari_ini
      )
    );

    setText(
      'statIzinPending',
      numberFormat(
        data.izin_pending
      )
    );

    setText(
      'statAdmin',
      numberFormat(
        data.total_admin
      )
    );


    setText(
      'summaryHadir',
      numberFormat(
        data.hadir_hari_ini
      )
    );

    setText(
      'summaryTerlambat',
      numberFormat(
        data.terlambat_hari_ini
      )
    );

    setText(
      'summaryBelumAbsen',
      numberFormat(
        data.belum_absen_hari_ini
      )
    );


    /*
     * FIX:
     * Sebelumnya kurang tanda ")".
     */

    setText(
      'summaryIzin',
      numberFormat(
        data.izin_pending
      )
    );


    if (data.tanggal) {

      var date =
        parseDate(
          data.tanggal
        );

      if (date) {

        setText(
          'todayDate',
          formatDateLong(
            date
          )
        );

      }

    }


    loadAppSettings();

  }


  function setupNavigation() {

    document
      .querySelectorAll(
        '#adminApp .nav-item[data-page]'
      )
      .forEach(
        function (item) {

          item.addEventListener(
            'click',
            function () {

              navigate(
                item.getAttribute(
                  'data-page'
                )
              );

            }
          );

        }
      );

  }


  function setupQuickActions() {

    document
      .querySelectorAll(
        '#adminApp .quick-card[data-go]'
      )
      .forEach(
        function (item) {

          item.addEventListener(
            'click',
            function () {

              navigate(
                item.getAttribute(
                  'data-go'
                )
              );

            }
          );

        }
      );

  }


  function navigate(
    page
  ) {

    if (!page) {
      return;
    }


    currentPage =
      page;


    document
      .querySelectorAll(
        '#adminApp .app-page'
      )
      .forEach(
        function (section) {

          section.classList.toggle(
            'active',
            section.id ===
            'page-' + page
          );

        }
      );


    document
      .querySelectorAll(
        '#adminApp .nav-item[data-page]'
      )
      .forEach(
        function (item) {

          item.classList.toggle(
            'active',
            item.getAttribute(
              'data-page'
            ) === page
          );

        }
      );


    var titles = {

      dashboard: [
        'Dashboard',
        'Ringkasan aktivitas hari ini'
      ],

      rekap: [
        'Rekap Absensi',
        'Rekap kehadiran seluruh pegawai'
      ],

      izin: [
        'Pengajuan Izin',
        'Kelola pengajuan pegawai'
      ],

      users: [
        'Manajemen User',
        'Kelola akun pengguna'
      ],

      pengaturan: [
        'Pengaturan',
        'Konfigurasi aplikasi'
      ]

    };


    var title =
      titles[page] ||
      titles.dashboard;


    setText(
      'pageTitle',
      title[0]
    );

    setText(
      'pageSubtitle',
      title[1]
    );


    closeMobileMenu();


    /*
     * Hook modul berikutnya.
     */

    if (
      page === 'rekap' &&
      typeof window.AdminRekapApp !==
      'undefined'
    ) {

      window.AdminRekapApp.init();

    }


    if (
      page === 'izin' &&
      typeof window.AdminIzinApp !==
      'undefined'
    ) {

      window.AdminIzinApp.init();

    }


    if (
      page === 'users' &&
      typeof window.AdminUsersApp !==
      'undefined'
    ) {

      window.AdminUsersApp.init();

    }


    if (
      page === 'pengaturan' &&
      typeof window.AdminSettingsApp !==
      'undefined'
    ) {

      window.AdminSettingsApp.init();

    }

  }


  function setupRefresh() {

    var button =
      document.getElementById(
        'refreshDashboard'
      );


    if (!button) {
      return;
    }


    button.addEventListener(
      'click',
      function () {

        loadDashboard();

      }
    );

  }


  function setupMobileMenu() {

    var button =
      document.getElementById(
        'menuButton'
      );

    var overlay =
      document.getElementById(
        'sidebarOverlay'
      );


    if (button) {

      button.addEventListener(
        'click',
        function () {

          var sidebar =
            document.getElementById(
              'sidebar'
            );

          if (!sidebar) {
            return;
          }

          sidebar.classList.toggle(
            'open'
          );

          if (overlay) {

            overlay.classList.toggle(
              'show'
            );

          }

        }
      );

    }


    if (overlay) {

      overlay.addEventListener(
        'click',
        closeMobileMenu
      );

    }

  }


  function closeMobileMenu() {

    var sidebar =
      document.getElementById(
        'sidebar'
      );

    var overlay =
      document.getElementById(
        'sidebarOverlay'
      );


    if (sidebar) {

      sidebar.classList.remove(
        'open'
      );

    }


    if (overlay) {

      overlay.classList.remove(
        'show'
      );

    }

  }


  function startClock() {

    updateClock();


    if (clockTimer) {

      clearInterval(
        clockTimer
      );

    }


    clockTimer =
      setInterval(
        updateClock,
        1000
      );

  }


  function updateClock() {

    var now =
      new Date();


    setText(
      'todayClock',
      pad(now.getHours()) +
      ':' +
      pad(now.getMinutes()) +
      ':' +
      pad(now.getSeconds())
    );


    setText(
      'todayDate',
      formatDateLong(now)
    );

  }


  function setupLogout() {

    var button =
      document.getElementById(
        'sidebarLogout'
      );

    var cancel =
      document.getElementById(
        'cancelLogout'
      );

    var confirm =
      document.getElementById(
        'confirmLogout'
      );


    if (button) {

      button.addEventListener(
        'click',
        function () {

          var modal =
            document.getElementById(
              'logoutModal'
            );

          if (modal) {

            modal.classList.remove(
              'hidden'
            );

          }

        }
      );

    }


    if (cancel) {

      cancel.addEventListener(
        'click',
        function () {

          var modal =
            document.getElementById(
              'logoutModal'
            );

          if (modal) {

            modal.classList.add(
              'hidden'
            );

          }

        }
      );

    }


    if (confirm) {

      confirm.addEventListener(
        'click',
        logout
      );

    }

  }


  function logout() {

    var token =
      getToken();


    clearSession();


    var modal =
      document.getElementById(
        'logoutModal'
      );

    if (modal) {

      modal.classList.add(
        'hidden'
      );

    }


    showLoading(
      'Keluar...'
    );


    if (!token) {

      logoutToLogin();

      return;
    }


    google.script.run

      .withSuccessHandler(
        function () {

          logoutToLogin();

        }
      )

      .withFailureHandler(
        function () {

          logoutToLogin();

        }
      )

      .logout(
        token
      );

  }


  function logoutToLogin() {

    clearSession();


    var admin =
      document.getElementById(
        'adminContainer'
      );

    var pegawai =
      document.getElementById(
        'pegawaiContainer'
      );

    var login =
      document.getElementById(
        'loginContainer'
      );


    if (admin) {
      admin.style.display =
        'none';
    }

    if (pegawai) {
      pegawai.style.display =
        'none';
    }

    if (login) {
      login.style.display =
        'block';
    }


    hideLoading();


    if (
      document.getElementById(
        'password'
      )
    ) {

      document.getElementById(
        'password'
      ).value = '';

    }

  }


  /*
   * Pengaturan aplikasi.
   * Jika backend tersedia, ambil nama/logo.
   */

  function loadAppSettings() {

    var token =
      getToken();


    if (!token) {
      return;
    }


    /*
     * Nama aplikasi bisa diambil
     * melalui backend admin.
     *
     * Jika fungsi belum tersedia,
     * gunakan default.
     */

    if (
      typeof google === 'undefined' ||
      !google.script ||
      !google.script.run
    ) {

      return;

    }


    if (
      typeof google.script.run
        .getPengaturanAdmin ===
      'undefined'
    ) {

      setText(
        'sidebarAppName',
        'Absensi'
      );

      return;

    }


    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.success &&
            response.data
          ) {

            setText(
              'sidebarAppName',
              response.data.nama_app ||
              'Absensi'
            );

          }

        }
      )

      .withFailureHandler(
        function () {}
      )

      .getPengaturanAdmin(
        token
      );

  }


  function showLoading(
    text
  ) {

    var el =
      document.getElementById(
        'globalLoading'
      );

    var textEl =
      document.getElementById(
        'loadingText'
      );


    if (textEl) {

      textEl.textContent =
        text || 'Memuat...';

    }


    if (el) {

      el.classList.remove(
        'hidden'
      );

    }

  }


  function hideLoading() {

    var el =
      document.getElementById(
        'globalLoading'
      );


    if (el) {

      el.classList.add(
        'hidden'
      );

    }

  }


  function showToast(
    message,
    type
  ) {

    var toast =
      document.getElementById(
        'toast'
      );


    if (!toast) {
      return;
    }


    clearTimeout(
      toastTimer
    );


    toast.textContent =
      message || '';


    toast.className =
      'toast show ' +
      (type || '');


    toastTimer =
      setTimeout(
        function () {

          toast.classList.remove(
            'show'
          );

        },
        3500
      );

  }


  function setText(
    id,
    value
  ) {

    var el =
      document.getElementById(
        id
      );


    if (el) {

      el.textContent =
        value == null
          ? ''
          : String(value);

    }

  }


  function numberFormat(
    value
  ) {

    var n =
      Number(value);


    if (isNaN(n)) {
      n = 0;
    }


    return n.toLocaleString(
      'id-ID'
    );

  }


  function parseDate(
    value
  ) {

    var parts =
      String(value)
        .split('-');


    if (
      parts.length !== 3
    ) {

      return null;

    }


    var d =
      new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );


    return isNaN(
      d.getTime()
    )
      ? null
      : d;

  }


  function formatDateLong(
    date
  ) {

    var days = [
      'Minggu',
      'Senin',
      'Selasa',
      'Rabu',
      'Kamis',
      'Jumat',
      'Sabtu'
    ];


    var months = [
      'Januari',
      'Februari',
      'Maret',
      'April',
      'Mei',
      'Juni',
      'Juli',
      'Agustus',
      'September',
      'Oktober',
      'November',
      'Desember'
    ];


    return (
      days[date.getDay()] +
      ', ' +
      date.getDate() +
      ' ' +
      months[date.getMonth()] +
      ' ' +
      date.getFullYear()
    );

  }


  function pad(
    n
  ) {

    return String(
      n
    ).padStart(
      2,
      '0'
    );

  }


  function getInitial(
    name
  ) {

    var value =
      String(
        name || 'A'
      ).trim();


    return value
      ? value.charAt(0).toUpperCase()
      : 'A';

  }


  function escapeAttribute(
    value
  ) {

    return String(
      value || ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      );

  }


  function normalizeError(
    error
  ) {

    if (!error) {

      return 'Terjadi kesalahan pada server.';

    }


    if (
      typeof error ===
      'string'
    ) {

      return error;

    }


    return error.message ||
      'Terjadi kesalahan pada server.';

  }


  return {

    init: init,

    navigate: navigate,

    refresh: loadDashboard

  };


})();

</script>
