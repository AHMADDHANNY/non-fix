<script>
(function () {

  'use strict';

  /* =========================================================
     STORAGE
     ========================================================= */

  var STORAGE_TOKEN =
    'absensi_session_token';

  var STORAGE_USER =
    'absensi_session_user';


  /* =========================================================
     ELEMENT
     ========================================================= */

  var form =
    document.getElementById('loginForm');

  var usernameInput =
    document.getElementById('username');

  var passwordInput =
    document.getElementById('password');

  var loginButton =
    document.getElementById('loginButton');

  var loginButtonText =
    document.getElementById('loginButtonText');

  var loginSpinner =
    document.getElementById('loginSpinner');

  var loginMessage =
    document.getElementById('loginMessage');

  var togglePassword =
    document.getElementById('togglePassword');


  /* =========================================================
     INIT
     ========================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {

    setupPasswordToggle();

    setupLoginForm();

    loadAppName();

    checkExistingSession();

  }


  /* =========================================================
     PASSWORD TOGGLE
     ========================================================= */

  function setupPasswordToggle() {

    if (
      !togglePassword ||
      !passwordInput
    ) {
      return;
    }

    togglePassword.addEventListener(
      'click',
      function () {

        var visible =
          passwordInput.type === 'text';

        passwordInput.type =
          visible
            ? 'password'
            : 'text';

        togglePassword.textContent =
          visible
            ? '👁'
            : '🙈';

      }
    );

  }


  /* =========================================================
     LOGIN FORM
     ========================================================= */

  function setupLoginForm() {

    if (!form) {
      return;
    }

    form.addEventListener(
      'submit',
      function (event) {

        /*
         * WAJIB untuk Apps Script IFRAME.
         */
        event.preventDefault();

        login();

      }
    );

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  function login() {

    if (
      !usernameInput ||
      !passwordInput
    ) {
      return;
    }


    var username =
      usernameInput.value.trim();

    var password =
      passwordInput.value;


    clearMessage();


    if (!username) {

      showError(
        'Username wajib diisi.'
      );

      usernameInput.focus();

      return;
    }


    if (!password) {

      showError(
        'Password wajib diisi.'
      );

      passwordInput.focus();

      return;
    }


    setLoading(true);


    google.script.run

      .withSuccessHandler(
        function (response) {

          /*
           * SELALU hentikan loading
           * begitu server membalas.
           */
          setLoading(false);


          if (
            !response ||
            response.success !== true
          ) {

            showError(
              response &&
              response.message
                ? response.message
                : 'Username atau password salah.'
            );

            passwordInput.value = '';

            passwordInput.focus();

            return;
          }


          if (!response.token) {

            showError(
              'Login berhasil tetapi token session tidak diterima.'
            );

            return;
          }


          var user =
            response.user || {};


          var role =
            String(
              user.role || ''
            )
            .trim()
            .toLowerCase();


          if (
            role !== 'admin' &&
            role !== 'pegawai'
          ) {

            clearSession();

            showError(
              'Role akun tidak valid.'
            );

            return;
          }


          /*
           * SIMPAN SESSION
           */

          try {

            localStorage.setItem(
              STORAGE_TOKEN,
              String(response.token)
            );

            localStorage.setItem(
              STORAGE_USER,
              JSON.stringify(user)
            );

          } catch (error) {

            setLoading(false);

            showError(
              'Session tidak dapat disimpan di browser.'
            );

            return;
          }


          showSuccess(
            'Login berhasil. Membuka aplikasi...'
          );

          showSuccess(
  'Login berhasil. Menyiapkan dashboard...'
);

redirectByRole(user);

        }
      )

      .withFailureHandler(
        function (error) {

          setLoading(false);

          showError(
            normalizeError(error)
          );

        }
      )

      .login(
        username,
        password
      );

  }


  /* =========================================================
     CHECK EXISTING SESSION
     ========================================================= */

  function checkExistingSession() {

    var token =
      getToken();


    if (!token) {
      return;
    }


    /*
     * Jangan menampilkan loading login
     * hanya karena session lama sedang diperiksa.
     */

    google.script.run

      .withSuccessHandler(
        function (response) {

          if (
            response &&
            response.valid === true &&
            response.user
          ) {

            saveUser(
              response.user
            );

            redirectByRole(
              response.user
            );

            return;
          }


          clearSession();

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Jika gagal validasi session lama,
           * biarkan user tetap berada di Login.
           */

          clearSession();

        }
      )

      .verifySession(
        token
      );

  }


  /* =========================================================
     REDIRECT BY ROLE
     ========================================================= */

  function redirectByRole(user) {

  if (!user) {

    setLoading(false);

    showError(
      'Data pengguna tidak tersedia.'
    );

    return;
  }


  var role =
    String(
      user.role || ''
    )
    .trim()
    .toLowerCase();


  var targetPage = '';


  if (role === 'admin') {

    targetPage =
      'DashboardAdmin';

  } else if (role === 'pegawai') {

    targetPage =
      'DashboardPegawai';

  } else {

    clearSession();

    setLoading(false);

    showError(
      'Role pengguna tidak dikenali.'
    );

    return;
  }


  /*
   * Ambil URL Web App asli dari server.
   */
  google.script.run

    .withSuccessHandler(
      function (webAppUrl) {

        setLoading(false);


        if (!webAppUrl) {

          showError(
            'URL Web App tidak ditemukan.'
          );

          return;
        }


        var targetUrl =
          String(webAppUrl) +
          '?page=' +
          encodeURIComponent(
            targetPage
          );


        /*
         * Hapus tombol lama jika ada.
         */
        var old =
          document.getElementById(
            'openDashboardButton'
          );

        if (old) {
          old.remove();
        }


        /*
         * Buat LINK ASLI.
         *
         * Bukan window.top.location.
         *
         * target="_top" diperlukan oleh
         * Apps Script IFRAME sandbox.
         */
        var link =
          document.createElement('a');


        link.id =
          'openDashboardButton';

        link.href =
          targetUrl;

        link.target =
          '_top';

        link.textContent =
          targetPage === 'DashboardAdmin'
            ? 'Buka Dashboard Admin'
            : 'Buka Dashboard Pegawai';


        link.style.display =
          'block';

        link.style.width =
          '100%';

        link.style.boxSizing =
          'border-box';

        link.style.marginTop =
          '12px';

        link.style.padding =
          '13px 16px';

        link.style.borderRadius =
          '10px';

        link.style.background =
          '#2563eb';

        link.style.color =
          '#ffffff';

        link.style.textAlign =
          'center';

        link.style.textDecoration =
          'none';

        link.style.fontWeight =
          '700';


        /*
         * Sembunyikan tombol login.
         */
        if (loginButton) {

          loginButton.style.display =
            'none';

        }


        /*
         * Tampilkan pesan.
         */
        showSuccess(
          'Login berhasil. Klik tombol di bawah untuk membuka aplikasi.'
        );


        /*
         * Letakkan tombol setelah form.
         */
        if (form) {

          form.appendChild(
            link
          );

        }

      }
    )

    .withFailureHandler(
      function (error) {

        setLoading(false);

        showError(
          normalizeError(error)
        );

      }
    )

    .getWebAppUrl();

}


    /*
     * JANGAN lagi menggunakan:
     *
     * window.top.location.href =
     *
     * langsung dari callback google.script.run.
     *
     * Apps Script HTML Service berjalan
     * di sandbox iframe.
     */


    google.script.run

      .withSuccessHandler(
        function (webAppUrl) {

          var baseUrl =
            String(
              webAppUrl || ''
            )
            .trim();


          /*
           * Jika ScriptApp.getService().getUrl()
           * gagal, gunakan URL halaman saat ini
           * sebagai fallback.
           */
          if (!baseUrl) {

            baseUrl =
              getCurrentWebAppUrl();

          }


          if (!baseUrl) {

            setLoading(false);

            showRedirectButton(
              targetPage
            );

            return;
          }


          var targetUrl =
            baseUrl +
            (
              baseUrl.indexOf('?') >= 0
                ? '&'
                : '?'
            ) +
            'page=' +
            encodeURIComponent(
              targetPage
            );


          /*
           * Buat link target="_top".
           *
           * Ini mengikuti mekanisme yang direkomendasikan
           * Apps Script untuk keluar dari iframe sandbox.
           */

          createTopNavigation(
            targetUrl
          );

        }
      )

      .withFailureHandler(
        function () {

          var fallback =
            getCurrentWebAppUrl();


          if (fallback) {

            createTopNavigation(
              fallback +
              (
                fallback.indexOf('?') >= 0
                  ? '&'
                  : '?'
              ) +
              'page=' +
              encodeURIComponent(
                targetPage
              )
            );

            return;
          }


          setLoading(false);

          showRedirectButton(
            targetPage
          );

        }
      )

      .getWebAppUrl();

  }


  /* =========================================================
     TOP NAVIGATION
     ========================================================= */

  function createTopNavigation(
    url
  ) {

    /*
     * Hapus link redirect lama.
     */

    var old =
      document.getElementById(
        'absensiRedirectLink'
      );

    if (old) {
      old.remove();
    }


    /*
     * Link asli target="_top".
     */

    var link =
      document.createElement('a');

    link.id =
      'absensiRedirectLink';

    link.href =
      url;

    link.target =
      '_top';

    link.rel =
      'noopener';

    link.textContent =
      'Membuka aplikasi...';

    link.style.position =
      'fixed';

    link.style.left =
      '-9999px';

    link.style.top =
      '-9999px';


    document.body.appendChild(
      link
    );


    /*
     * Coba navigasi.
     */

    try {

      link.click();

    } catch (error) {

      /*
       * Jika browser menolak navigasi,
       * tampilkan tombol manual.
       */

      showManualRedirect(
        url
      );

    }


    /*
     * Jangan biarkan UI terjebak
     * "Memproses..." selamanya.
     */

    setTimeout(
      function () {

        setLoading(false);

      },
      1000
    );

  }


  /* =========================================================
     FALLBACK CURRENT URL
     ========================================================= */

  function getCurrentWebAppUrl() {

    try {

      var url =
        window.location.href;


      /*
       * Jika sedang berada di halaman
       * userCodeAppPanel, ambil bagian sebelum
       * query string.
       */

      if (
        url.indexOf('?') !== -1
      ) {

        url =
          url.split('?')[0];

      }


      /*
       * Jangan menggunakan URL kosong.
       */

      if (
        url &&
        (
          url.indexOf(
            'script.google.com'
          ) !== -1 ||
          url.indexOf(
            'googleusercontent.com'
          ) !== -1
        )
      ) {

        return url;

      }

    } catch (error) {}

    return '';

  }


  /* =========================================================
     MANUAL REDIRECT
     ========================================================= */

  function showRedirectButton(
    targetPage
  ) {

    setLoading(false);


    var url =
      '';


    google.script.run

      .withSuccessHandler(
        function (webAppUrl) {

          url =
            String(
              webAppUrl || ''
            )
            .trim();


          if (!url) {

            showError(
              'URL aplikasi tidak dapat ditemukan. Silakan buka ulang Web App.'
            );

            return;
          }


          showManualRedirect(
            url +
            (
              url.indexOf('?') >= 0
                ? '&'
                : '?'
            ) +
            'page=' +
            encodeURIComponent(
              targetPage
            )
          );

        }
      )

      .withFailureHandler(
        function () {

          showError(
            'Gagal mendapatkan URL aplikasi.'
          );

        }
      )

      .getWebAppUrl();

  }


  function showManualRedirect(
    url
  ) {

    setLoading(false);


    var old =
      document.getElementById(
        'absensiManualRedirect'
      );

    if (old) {
      old.remove();
    }


    var wrapper =
      document.createElement('div');

    wrapper.id =
      'absensiManualRedirect';

    wrapper.style.marginTop =
      '12px';

    wrapper.style.textAlign =
      'center';


    var link =
      document.createElement('a');

    link.href =
      url;

    link.target =
      '_top';

    link.textContent =
      'Klik di sini untuk membuka Dashboard';

    link.style.display =
      'inline-block';

    link.style.padding =
      '10px 16px';

    link.style.borderRadius =
      '8px';

    link.style.background =
      '#2563eb';

    link.style.color =
      '#fff';

    link.style.textDecoration =
      'none';

    link.style.fontWeight =
      '600';


    wrapper.appendChild(
      link
    );


    if (form) {

      form.appendChild(
        wrapper
      );

    }

  }


  /* =========================================================
     APP NAME
     ========================================================= */

  function loadAppName() {

    google.script.run

      .withSuccessHandler(
        function (name) {

          if (!name) {
            return;
          }


          var element =
            document.getElementById(
              'appName'
            );


          if (element) {

            element.textContent =
              name;

          }

        }
      )

      .withFailureHandler(
        function () {

          /*
           * Nama default tetap digunakan.
           */

        }
      )

      .getNamaApp();

  }


  /* =========================================================
     TOKEN
     ========================================================= */

  function getToken() {

    try {

      return (
        localStorage.getItem(
          STORAGE_TOKEN
        ) || ''
      );

    } catch (error) {

      return '';

    }

  }


  /* =========================================================
     SAVE USER
     ========================================================= */

  function saveUser(
    user
  ) {

    try {

      localStorage.setItem(
        STORAGE_USER,
        JSON.stringify(
          user || {}
        )
      );

    } catch (error) {}

  }


  /* =========================================================
     CLEAR SESSION
     ========================================================= */

  function clearSession() {

    try {

      localStorage.removeItem(
        STORAGE_TOKEN
      );

      localStorage.removeItem(
        STORAGE_USER
      );

    } catch (error) {}

  }


  /* =========================================================
     LOADING
     ========================================================= */

  function setLoading(
    loading
  ) {

    if (loginButton) {

      loginButton.disabled =
        !!loading;

    }


    if (loginSpinner) {

      loginSpinner.classList.toggle(
        'hidden',
        !loading
      );

    }


    if (loginButtonText) {

      loginButtonText.textContent =
        loading
          ? 'Memproses...'
          : 'Masuk';

    }

  }


  /* =========================================================
     ERROR
     ========================================================= */

  function showError(
    message
  ) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Terjadi kesalahan.';


    loginMessage.className =
      'message error';

  }


  /* =========================================================
     SUCCESS
     ========================================================= */

  function showSuccess(
    message
  ) {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      message ||
      'Login berhasil.';


    loginMessage.className =
      'message success';

  }


  /* =========================================================
     CLEAR MESSAGE
     ========================================================= */

  function clearMessage() {

    if (!loginMessage) {
      return;
    }


    loginMessage.textContent =
      '';

    loginMessage.className =
      'message hidden';

  }


  /* =========================================================
     NORMALIZE ERROR
     ========================================================= */

  function normalizeError(
    error
  ) {

    if (!error) {

      return (
        'Terjadi kesalahan pada server.'
      );

    }


    if (
      typeof error === 'string'
    ) {

      return error;

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return (
      'Terjadi kesalahan pada server.'
    );

  }


  /* =========================================================
     GLOBAL APP
     ========================================================= */

  window.AbsensiApp = {

    getToken:
      getToken,


    getUser:
      function () {

        try {

          var raw =
            localStorage.getItem(
              STORAGE_USER
            );


          return raw
            ? JSON.parse(raw)
            : null;

        } catch (error) {

          return null;

        }

      },


    clearSession:
      clearSession,


    redirectByRole:
      redirectByRole

  };


})();
</script>
